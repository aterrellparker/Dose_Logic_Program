  function formError(msg) {
    $('#form-error').innerHTML = '<p class="field__error" style="margin-bottom:var(--sp-4)">' +
      icon('warning', 18) + '<span>' + esc(msg) + '</span></p>';
    $('#modal-body').scrollTop = 0;
  }

  function saveMedForm() {
    var pid = state.patientId, medId = state.editingMedId;
    var name = $('#f-name').value.trim();
    var strength = $('#f-strength').value.trim();
    var cartVal = $('#f-cart').value;
    var qty = parseInt($('#f-qty').value, 10);
    var start = $('#f-start').value;
    var end = $('#f-end').value;
    var times = [0,1,2].map(function (i) { return $('#f-time' + i).value; })
                       .filter(Boolean).sort();

    $('#cart-field').classList.remove('field--invalid');

    if (!name)     return formError('Enter the medication name as it appears on the label.');
    if (!strength) return formError('Enter the strength, for example "10 mg".');
    if (cartVal === '') return formError('Choose which cartridge this medication goes in.');
    if (!times.length)  return formError('Add at least one dose time.');
    if (!(qty >= 1))    return formError('Pills per dose must be 1 or more.');
    if (!start)         return formError('Enter the date this schedule starts.');
    if (end && end < start) return formError('The end date is before the start date. Fix one of them.');

    var pos = parseInt(cartVal, 10);
    var cart = DB.getCartridge(pid, pos);

    // The rejection the brief asks for: never silently reassign a cartridge
    // that already holds something, and name what is in the way.
    if (cart && cart.medId && cart.medId !== medId) {
      var other = DB.getMedication(cart.medId);
      $('#cart-field').classList.add('field--invalid');
      return formError('Cartridge ' + pos + ' already holds ' + other.name + ' ' + other.strength +
        '. Pick an empty cartridge, or remove that medication first.');
    }

    var isNew = !medId;
    var summary = (isNew ? 'Load ' : 'Update ') + name + ' ' + strength + ' in cartridge ' + pos + '. ' +
      'The dispenser will release ' + qty + (qty === 1 ? ' pill' : ' pills') + ' at ' +
      times.map(fmtHHMM).join(' and ') + ', starting ' + fmtLongDate(new Date(start + 'T00:00:00').getTime()) + '.';

    confirmAndSync('Confirm schedule change', summary, function () {
      if (isNew) {
        var newId = 'm' + (Date.now() % 100000);
        DB.medications.push({ id:newId, patientId:pid, name:name, strength:strength,
          form:'tablet', cartridge:pos, times:times, qty:qty, startDate:start, endDate:end || null });
        if (cart) { cart.medId = newId; if (!cart.count) cart.count = 30; }
      } else {
        var m = DB.getMedication(medId);
        var oldCart = DB.getCartridge(pid, m.cartridge);
        if (oldCart && oldCart.position !== pos) { oldCart.medId = null; oldCart.count = 0; }
        m.name = name; m.strength = strength; m.cartridge = pos;
        m.times = times; m.qty = qty; m.startDate = start; m.endDate = end || null;
        if (cart) { cart.medId = medId; if (!cart.count) cart.count = 30; }
      }
    }, (isNew ? 'Added ' : 'Updated ') + name + ' ' + strength + '.');
  }

  /* Every schedule edit shows what the device will do, then a real sync state.
     Silent writes to a machine that dispenses pills are not acceptable. */
  function confirmAndSync(title, summary, apply, doneMsg) {
    openModal(title,
      '<p style="margin-bottom:var(--sp-4)">' + esc(summary) + '</p>' +
      '<div class="notice">' + icon('device', 20) +
        '<div><b>This changes what the dispenser does</b>' +
        '<p class="meta" style="margin-top:4px">The new schedule is written to the unit and takes effect ' +
        'from the next dose window.</p></div></div>' +
      '<div id="sync-state"></div>',
      '<button class="btn btn--primary" type="button" data-confirmsync="1">Confirm and sync</button>' +
      '<button class="btn btn--secondary" type="button" data-modal-close="1">Cancel</button>');

    pendingSync = { apply: apply, doneMsg: doneMsg };
  }

  var pendingSync = null;

  function runSync() {
    if (!pendingSync) return;
    var job = pendingSync; pendingSync = null;

    $('#modal-foot').innerHTML = '';
    $('#sync-state').innerHTML =
      '<p class="sync" style="margin-top:var(--sp-4)" role="status">' +
      logoMark(28, { stepping: true }) + '<span>Syncing to the dispenser…</span></p>';

    setTimeout(function () {
      commit(job.apply, { toast: job.doneMsg, announce: job.doneMsg + ' Synced to the dispenser.' });
      $('#sync-state').innerHTML =
        '<div class="notice notice--good" style="margin-top:var(--sp-4)">' + icon('info', 20) +
        '<div><b>Synced</b><p class="meta" style="margin-top:4px">' + esc(job.doneMsg) + '</p></div></div>';
      $('#modal-foot').innerHTML = '<button class="btn btn--primary" type="button" data-modal-close="1">Done</button>';
      var b = $('#modal-foot button'); if (b) b.focus();
    }, 1500);
  }

  function confirmRemoveMed(medId) {
    var m = DB.getMedication(medId);
    if (!m) return;
    confirmAndSync('Remove medication',
      'Remove ' + m.name + ' ' + m.strength + ' from the schedule and free cartridge ' + m.cartridge +
      '. Doses already recorded stay in the history.',
      function () {
        var c = DB.getCartridge(m.patientId, m.cartridge);
        if (c) { c.medId = null; c.count = 0; }
        DB.medications = DB.medications.filter(function (x) { return x.id !== medId; });
        DB.doseLog = DB.doseLog.filter(function (d) {
          return d.medId !== medId || d.scheduledTs < now();   // keep the record, drop the future
        });
      },
      'Removed ' + m.name + ' ' + m.strength + '.');
  }

  /* ==================================================================
     VIEW 3 — CARTRIDGES
     Drawn as the carousel it physically is, not as a list. The ring rotates
     in 45-degree steps and the chute marker stays fixed at 12 o'clock,
     because that is how the mechanism actually indexes.
     ================================================================== */
  function polar(cx, cy, r, deg) {
    var a = deg * Math.PI / 180;
    return [+(cx + r * Math.cos(a)).toFixed(2), +(cy + r * Math.sin(a)).toFixed(2)];
  }
  function annulus(cx, cy, rIn, rOut, a0, a1) {
    var p1 = polar(cx, cy, rOut, a0), p2 = polar(cx, cy, rOut, a1);
    var p3 = polar(cx, cy, rIn, a1),  p4 = polar(cx, cy, rIn, a0);
    var large = (a1 - a0) > 180 ? 1 : 0;
    return 'M' + p1[0] + ' ' + p1[1] + 'A' + rOut + ' ' + rOut + ' 0 ' + large + ' 1 ' + p2[0] + ' ' + p2[1] +
           'L' + p3[0] + ' ' + p3[1] + 'A' + rIn + ' ' + rIn + ' 0 ' + large + ' 0 ' + p4[0] + ' ' + p4[1] + 'Z';
  }

  function carouselSvg(pid) {
    var CX = 200, CY = 200, R_IN = 56, R_OUT = 168;
    var carts = DB.getCartridges(pid);
    var spin = state.carouselSpin;

    var wedges = carts.map(function (c) {
      var mid = -90 + c.position * 45;
      var path = annulus(CX, CY, R_IN, R_OUT, mid - 21.3, mid + 21.3);
      var med = c.medId ? DB.getMedication(c.medId) : null;
      var low = med && isLow(pid, c.position);
      var sel = state.selectedCartridge === c.position;

      var fill = !med ? 'var(--dl-card)' : (low ? 'var(--dl-amber-tint)' : 'var(--dl-ink-tint)');
      var stroke = sel ? 'var(--dl-ink)' : (!med ? 'var(--dl-mute)' : (low ? 'var(--dl-amber)' : 'var(--dl-line)'));
      var dash = med ? '' : ' stroke-dasharray="5 4"';

      // A 45-degree wedge is only ~85 user units wide at the label radius, so
      // names are clipped to what actually fits rather than allowed to run
      // across the neighbouring cartridge.
      var lp = polar(CX, CY, 120, mid);
      var short = med && med.name.length > 10 ? med.name.slice(0, 9) + '…' : (med ? med.name : '');
      var label = med
        ? '<text x="' + lp[0] + '" y="' + (lp[1] - 5) + '" text-anchor="middle" font-size="13" font-weight="700" fill="var(--dl-ink)">' +
            esc(short) + '<title>' + esc(med.name + ' ' + med.strength) + '</title></text>' +
          '<text x="' + lp[0] + '" y="' + (lp[1] + 12) + '" text-anchor="middle" font-size="12" fill="var(--dl-slate)">' +
            c.count + ' left</text>'
        : '<text x="' + lp[0] + '" y="' + (lp[1] + 4) + '" text-anchor="middle" font-size="12" fill="var(--dl-slate)">empty</text>';

      // At 3 and 9 o'clock the label and the position badge sit on the same
      // horizontal radius, so they need ~45 units of separation or they collide.
      var num = polar(CX, CY, 68, mid);

      return '<g class="cart-hit" role="button" tabindex="0" data-cart="' + c.position + '" ' +
               'aria-label="Cartridge ' + c.position + ', ' +
               esc(med ? med.name + ' ' + med.strength + ', ' + c.count + ' pills left' : 'empty') +
               (low ? ', refill soon' : '') + '"' + (sel ? ' aria-pressed="true"' : '') + '>' +
               '<path class="cart-wedge" d="' + path + '" fill="' + fill + '" stroke="' + stroke +
                 '" stroke-width="' + (sel ? 3 : 1.5) + '"' + dash + '/>' +
               '<g class="cart-label" style="transform-origin:' + lp[0] + 'px ' + lp[1] + 'px">' + label + '</g>' +
               '<g class="cart-label" style="transform-origin:' + num[0] + 'px ' + num[1] + 'px">' +
                 '<circle cx="' + num[0] + '" cy="' + num[1] + '" r="12" fill="var(--dl-card)" stroke="var(--dl-line)"/>' +
                 '<text x="' + num[0] + '" y="' + (num[1] + 4.5) + '" text-anchor="middle" font-size="13" ' +
                 'font-weight="700" fill="var(--dl-slate)">' + c.position + '</text></g>' +
             '</g>';
    }).join('');

    return '<svg class="carousel__svg" viewBox="0 0 400 400" style="--spin:' + spin + 'deg" ' +
             'role="img" aria-label="Eight-position carousel. Cartridge ' +
             DB.getDevice(pid).carouselIndex + ' is at the dispense position.">' +
             // Fixed chute marker — it does not rotate, the carousel does.
             '<g>' +
               '<path d="M186 6h28l-6 20h-16Z" fill="var(--dl-ink)"/>' +
               '<text x="200" y="42" text-anchor="middle" font-size="12" font-weight="700" ' +
                 'letter-spacing="1.2" fill="var(--dl-slate)">CHUTE</text>' +
             '</g>' +
             '<g class="carousel__ring">' + wedges + '</g>' +
             '<circle cx="200" cy="200" r="' + 40 + '" fill="var(--dl-card)" stroke="var(--dl-line)" stroke-width="1.5"/>' +
             '<text x="200" y="196" text-anchor="middle" font-size="12" font-weight="700" ' +
               'letter-spacing="1" fill="var(--dl-slate)">POS</text>' +
             '<text x="200" y="218" text-anchor="middle" font-size="20" font-weight="700" ' +
               'fill="var(--dl-ink)">' + DB.getDevice(pid).carouselIndex + '</text>' +
           '</svg>';
  }

  function cartridgeDetail(pid, pos) {
    var c = DB.getCartridge(pid, pos);
    if (!c) return '';
    var med = c.medId ? DB.getMedication(c.medId) : null;

    if (!med) {
      return '<div class="empty" style="padding:var(--sp-6) var(--sp-4)">' +
               '<h3>Cartridge ' + pos + ' is empty</h3>' +
               '<p>Nothing is loaded in this position. Assign a medication to start dispensing from it.</p>' +
               '<button class="btn btn--primary" type="button" data-assign="' + pos + '">Assign medication</button>' +
             '</div>';
    }

    var days = daysRemaining(pid, pos), low = isLow(pid, pos);
    var use = dailyUse(pid, pos);
    var fillPct = Math.round(c.count / c.capacity * 100);

    return '<div class="stack" style="gap:var(--sp-4)">' +
      '<div class="row"><h3 style="margin-right:auto">' + esc(med.name + ' ' + med.strength) + '</h3>' +
        (low ? '<span class="flag-low">' + icon('warning', 14) + 'Refill soon</span>' : '') + '</div>' +
      '<div class="grid grid--2" style="gap:var(--sp-4)">' +
        '<div><p class="label">Pills left</p><p class="big-num">' + c.count + '</p>' +
          '<div class="meter"><div class="meter__fill' + (low ? ' meter__fill--low' : '') +
            '" style="width:' + fillPct + '%"></div></div>' +
          '<p class="meta" style="margin-top:6px">of ' + c.capacity + ' capacity</p></div>' +
        '<div><p class="label">Days remaining</p><p class="big-num">' + (days === null ? '—' : days) + '</p>' +
          '<p class="meta" style="margin-top:6px">at ' + use + ' pill' + (use === 1 ? '' : 's') + ' a day</p></div>' +
      '</div>' +
      '<dl class="kv">' +
        '<dt>Dose times</dt><dd>' + med.times.map(fmtHHMM).map(esc).join(', ') + '</dd>' +
        '<dt>Per dose</dt><dd>' + med.qty + ' pill' + (med.qty === 1 ? '' : 's') + '</dd>' +
        '<dt>Position</dt><dd>' + pos + ' of 0–7</dd>' +
      '</dl>' +
      '<div class="row">' +
        '<button class="btn btn--primary" type="button" data-refill="' + pos + '">' + icon('refill', 18) + 'Refill cartridge</button>' +
        '<button class="btn btn--secondary" type="button" data-editmed="' + esc(med.id) + '">Edit schedule</button>' +
      '</div>' +
    '</div>';
  }

  function renderCartridges() {
    var pid = state.patientId;
    var carts = DB.getCartridges(pid);
    var lows = carts.filter(function (c) { return c.medId && isLow(pid, c.position); });

    var list = carts.map(function (c) {
      var med = c.medId ? DB.getMedication(c.medId) : null;
      var days = daysRemaining(pid, c.position);
      var low = med && isLow(pid, c.position);
      var sel = state.selectedCartridge === c.position;
      return '<button type="button" class="cart-row" data-cart="' + c.position + '" aria-pressed="' + sel + '">' +
        '<span class="cart-row__pos' + (med ? '' : ' cart-row__pos--empty') + '">' + c.position + '</span>' +
        '<span class="cart-row__name">' + (med ? esc(med.name) : '<em>Empty</em>') +
          '<small>' + (med ? esc(med.strength + ' · ' + med.times.map(fmtHHMM).join(', ')) : 'Available') + '</small></span>' +
        (med ? '<span class="cart-row__count">' + c.count + '<small>' +
                 (days === null ? '' : days + ' day' + (days === 1 ? '' : 's')) + '</small></span>' : '') +
        (low ? '<span class="flag-low">' + icon('warning', 14) + 'Low</span>' : '') +
      '</button>';
    }).join('');

    var banner = lows.length
      ? '<div class="notice notice--warn">' + icon('warning', 20) +
        '<div><b>' + lows.length + ' cartridge' + (lows.length === 1 ? '' : 's') + ' below a week of supply</b>' +
        '<p class="meta" style="margin-top:4px">' +
        esc(lows.map(function (c) { return DB.getMedication(c.medId).name + ' (position ' + c.position + ')'; }).join(', ')) +
        '. Refill and log it so the estimate resets.</p></div></div>'
      : '';

    $('#view-cartridges').innerHTML =
      '<div class="view__head"><h1 id="h-cartridges">Cartridges</h1>' +
      '<p>Eight positions on the carousel. Counts come from the load cell under the collection cup, ' +
      'so they reflect what is physically in the unit.</p></div>' +
      '<div class="stack">' + banner +
        '<div class="carousel">' +
          '<div class="carousel__stage">' + carouselSvg(pid) +
            '<p class="meta" style="text-align:center;margin-top:var(--sp-3)">' +
            'Select a wedge or a row to see that cartridge.</p></div>' +
          '<div class="stack">' +
            '<div class="cart-list">' + list + '</div>' +
            '<section class="panel" aria-labelledby="cart-detail-h">' +
              '<p class="label" id="cart-detail-h">Cartridge ' + state.selectedCartridge + '</p>' +
              '<div style="margin-top:var(--sp-3)">' + cartridgeDetail(pid, state.selectedCartridge) + '</div>' +
            '</section>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function refillCartridge(pos) {
    var pid = state.patientId;
    var c = DB.getCartridge(pid, pos);
    if (!c || !c.medId) return;
    var med = DB.getMedication(c.medId);
    commit(function () {
      c.count = c.capacity;
      pushAlert(pid, 'informational', med.name + ' cartridge refilled',
        'Cartridge ' + pos + ' was refilled to ' + c.capacity + ' pills.',
        'No action needed. The days-remaining estimate has reset.');
    }, {
      toast: 'Cartridge ' + pos + ' refilled to ' + c.capacity + ' pills.',
      announce: med.name + ' cartridge refilled to ' + c.capacity + ' pills.'
    });
  }

  /* ---- Dose detail -------------------------------------------------- */
  function openDoseDetail(doseId) {
    var d = DB.getDose(doseId);
    if (!d) return;
    var med = DB.getMedication(d.medId);
    var canAct = d.status === 'dispensed_not_taken' || d.status === 'due' || d.status === 'upcoming';

    openModal((med ? med.name + ' ' + med.strength : 'Dose'),
      '<div style="margin-bottom:var(--sp-4)">' + chip(d.status, { noPulse: true }) + '</div>' +
      '<dl class="kv">' +
        '<dt>Date</dt><dd>' + esc(fmtLongDate(d.scheduledTs)) + '</dd>' +
        '<dt>Scheduled</dt><dd>' + esc(fmtHHMM(d.scheduled)) + '</dd>' +
        '<dt>Dispensed</dt><dd>' + esc(d.dispensedTs ? fmtClock(d.dispensedTs) : 'Not dispensed') + '</dd>' +
        '<dt>Picked up</dt><dd>' + esc(d.pickupTs ? fmtClock(d.pickupTs) : 'Not picked up') + '</dd>' +
        '<dt>Quantity</dt><dd>' + d.qty + ' pill' + (d.qty === 1 ? '' : 's') + '</dd>' +
        '<dt>Cartridge</dt><dd>Position ' + d.cartridge + '</dd>' +
      '</dl>' +
      '<p class="meta" style="margin-top:var(--sp-4)">' + esc(STATUS_SR[d.status]) + '.</p>',
      (canAct
        ? '<button class="btn btn--primary" type="button" data-pickup="' + esc(d.id) + '">Mark picked up</button>' +
          '<button class="btn btn--secondary" type="button" data-skip="' + esc(d.id) + '">Skip this dose</button>'
        : '') +
      '<button class="btn btn--ghost" type="button" data-modal-close="1">Close</button>');
  }

  /* ==================================================================
     CHARTS
     Hand-generated inline SVG. No chart library and no canvas: the panel
     will see this projected, and text in real SVG stays crisp at any size.
     Every bar is a two-part column — dark = doses taken, light = the rest —
     so the reader never has to guess what the missing height means.
     ================================================================== */
  function sparkline(days) {
    var W = 220, H = 48, gap = 3;
    var bw = (W - gap * (days.length - 1)) / days.length;
    var bars = days.map(function (d, i) {
      var x = +(i * (bw + gap)).toFixed(2);
      var h = Math.max(2, d.resolved ? d.rate * H : 0);
      var base = '<rect x="' + x + '" y="0" width="' + bw.toFixed(2) + '" height="' + H +
                 '" fill="var(--dl-line)" rx="2"/>';
      var fill = d.resolved
        ? '<rect x="' + x + '" y="' + (H - h).toFixed(2) + '" width="' + bw.toFixed(2) +
          '" height="' + h.toFixed(2) + '" fill="var(--dl-ink)" rx="2"/>' : '';
      return base + fill;
    }).join('');

    var summary = days.map(function (d) {
      return fmtDate(d.ts) + ': ' + (d.resolved ? pct(d.rate) + '%' : 'no doses');
    }).join(', ');

    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
           'aria-label="Daily adherence for the last 7 days. ' + esc(summary) + '">' + bars + '</svg>';
  }

  function adherenceChart(days) {
    var W = 760, H = 250, L = 44, R = 10, T = 14, B = 32;
    var pw = W - L - R, ph = H - T - B;
    var n = days.length;
    var gap = n > 45 ? 1 : (n > 14 ? 2 : 6);
    var bw = Math.max(2, (pw - gap * (n - 1)) / n);

    var grid = '', ticks = [0, 25, 50, 75, 100];
    ticks.forEach(function (v) {
      var y = +(T + ph - (v / 100) * ph).toFixed(2);
      grid += '<line class="grid-line" x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '"/>' +
              '<text class="axis-label" x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + v + '%</text>';
    });

    var bars = days.map(function (d, i) {
      var x = +(L + i * (bw + gap)).toFixed(2);
      var h = d.resolved ? +(d.rate * ph).toFixed(2) : 0;
      var out = '<rect x="' + x + '" y="' + T + '" width="' + bw.toFixed(2) + '" height="' + ph +
                '" fill="var(--dl-line)"/>';
      if (d.resolved) {
        out += '<rect x="' + x + '" y="' + (T + ph - h).toFixed(2) + '" width="' + bw.toFixed(2) +
               '" height="' + h + '" fill="var(--dl-ink)"><title>' +
               esc(fmtDate(d.ts) + ' — ' + pct(d.rate) + '% (' + (d.taken + d.late) + ' of ' + d.resolved + ')') +
               '</title></rect>';
      }
      return out;
    }).join('');

    // Roughly six x labels whatever the range, so 7/30/90 all stay readable.
    var step = Math.max(1, Math.round(n / 6)), xlabels = '';
    for (var i = 0; i < n; i += step) {
      var x = +(L + i * (bw + gap) + bw / 2).toFixed(2);
      xlabels += '<text class="axis-label" x="' + x + '" y="' + (H - 10) + '" text-anchor="middle">' +
                 esc(fmtDate(days[i].ts).replace(/^\w+, /, '')) + '</text>';
    }

    var overall = days.reduce(function (a, d) { return a + (d.resolved ? d.rate : 0); }, 0) /
                  (days.filter(function (d) { return d.resolved; }).length || 1);

    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
           'aria-label="Daily adherence over ' + n + ' days, averaging ' + pct(overall) + ' percent.">' +
           grid + bars + xlabels +
           '<line class="grid-line" x1="' + L + '" y1="' + (T + ph) + '" x2="' + (W - R) + '" y2="' + (T + ph) +
           '" stroke="var(--dl-slate)"/></svg>';
  }

  function timeOfDayChart(buckets) {
    if (!buckets.length) return '<p class="meta">No resolved doses in this range.</p>';
    var W = 760, rowH = 46, T = 8, L = 92, R = 74;
    var H = T * 2 + buckets.length * rowH;
    var pw = W - L - R;

    var rows = buckets.map(function (b, i) {
      var y = T + i * rowH;
      var w = +(b.rate * pw).toFixed(2);
      return '<text class="axis-label" x="' + (L - 12) + '" y="' + (y + 26) + '" text-anchor="end" ' +
               'font-size="14" font-weight="700" fill="var(--dl-ink)">' + esc(fmtHHMM(b.time)) + '</text>' +
             '<rect x="' + L + '" y="' + (y + 10) + '" width="' + pw + '" height="22" fill="var(--dl-line)" rx="3"/>' +
             '<rect x="' + L + '" y="' + (y + 10) + '" width="' + w + '" height="22" fill="var(--dl-ink)" rx="3">' +
               '<title>' + esc(fmtHHMM(b.time) + ' — ' + pct(b.rate) + '% of ' + b.total + ' doses') + '</title></rect>' +
             '<text class="axis-label" x="' + (W - R + 10) + '" y="' + (y + 26) + '" font-size="14" ' +
               'font-weight="700" fill="var(--dl-ink)">' + pct(b.rate) + '%</text>';
    }).join('');

    var summary = buckets.map(function (b) { return fmtHHMM(b.time) + ' ' + pct(b.rate) + '%'; }).join(', ');
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
           'aria-label="Adherence by dose time. ' + esc(summary) + '">' + rows + '</svg>';
  }

  /* States a pattern only when the data actually shows one. Nothing here is a
     clinical claim — it is arithmetic on the dose log, phrased as such. */
  function timeOfDayInsight(buckets) {
    var am = buckets.filter(function (b) { return parseInt(b.time, 10) < 15; });
    var pm = buckets.filter(function (b) { return parseInt(b.time, 10) >= 15; });
    if (!am.length || !pm.length) return '';
    function avg(a) { return a.reduce(function (s, b) { return s + b.rate; }, 0) / a.length; }
    var d = avg(am) - avg(pm);
    if (Math.abs(d) < 0.12) return '';
    var worse = d > 0 ? 'Evening' : 'Morning';
    var wl = d > 0 ? pm : am, bl = d > 0 ? am : pm;
    return '<p class="insight"><b>' + worse + ' doses are the weak point.</b> ' +
      esc(wl.map(function (b) { return fmtHHMM(b.time); }).join(' and ')) + ' come in at ' +
      pct(avg(wl)) + '%, against ' + pct(avg(bl)) + '% for ' +
      esc(bl.map(function (b) { return fmtHHMM(b.time); }).join(' and ')) +
      '. Worth raising at the next appointment.</p>';
  }

  /* ==================================================================
     VIEW 4 — HISTORY
     ================================================================== */
  var LOG_LIMIT = 40;

  function renderHistory() {
    var pid = state.patientId, p = DB.getPatient(pid), days = state.historyRange;
    var s = rangeStats(pid, days);
    var byDay = adherenceByDay(pid, days);
    var byTime = adherenceByTimeOfDay(pid, days);

    var log = DB.getDoseLogRange(pid, rangeFrom(days), now())
                .filter(function (d) { return windowClosed(d) || d.status === 'dispensed_not_taken'; })
                .sort(function (a, b) { return b.scheduledTs - a.scheduledTs; });
    var shown = log.slice(0, LOG_LIMIT);

    var rows = shown.map(function (d) {
      var m = DB.getMedication(d.medId);
      return '<tr class="tbl__row" tabindex="0" data-dose="' + esc(d.id) + '">' +
        '<td>' + esc(m ? m.name : 'Dose') + '<div class="meta">' + esc(m ? m.strength : '') + '</div></td>' +
        '<td class="num">' + esc(fmtDate(d.scheduledTs)) + '</td>' +
        '<td class="num">' + esc(fmtHHMM(d.scheduled)) + '</td>' +
        '<td class="num">' + esc(d.dispensedTs ? fmtClock(d.dispensedTs) : '—') + '</td>' +
        '<td class="num">' + esc(d.pickupTs ? fmtClock(d.pickupTs) : '—') + '</td>' +
        '<td>' + chip(d.status, { noPulse: true }) + '</td>' +
        '<td class="num">' + d.cartridge + '</td></tr>';
    }).join('');

    var seg = [7, 30, 90].map(function (n) {
      return '<button type="button" class="seg__btn" data-range="' + n + '" aria-pressed="' +
             (n === days) + '">' + n + ' days</button>';
    }).join('');

    $('#view-history').innerHTML =
      '<div class="view__head"><h1 id="h-history">History</h1>' +
      '<p>Every dose ' + esc(firstName(pid)) + ' was scheduled to take, and what actually happened to it.</p></div>' +
      '<div class="stack">' +

        '<div class="row">' +
          '<div class="seg" role="group" aria-label="Time range">' + seg + '</div>' +
          '<button class="btn btn--secondary push" type="button" data-print="1">' +
            icon('print', 18) + 'Export summary</button>' +

  /* ---- Printable summary -------------------------------------------
     A caregiver taking this to an appointment is a real workflow, so the
     print output is built as its own document rather than a screenshot of
     the app with the chrome hidden. */
  function buildPrintSummary() {
    var pid = state.patientId, p = DB.getPatient(pid), days = state.historyRange;
    var s = rangeStats(pid, days);
    var byTime = adherenceByTimeOfDay(pid, days);
    var meds = DB.getMedications(pid);
    var log = DB.getDoseLogRange(pid, rangeFrom(days), now())
                .filter(function (d) { return windowClosed(d); })
                .sort(function (a, b) { return b.scheduledTs - a.scheduledTs; })
                .slice(0, 60);

    var medRows = meds.map(function (m) {
      return '<tr><td>' + esc(m.name) + '</td><td>' + esc(m.strength) + '</td><td>' +
             esc(m.times.map(fmtHHMM).join(', ')) + '</td><td>' + m.qty + '</td></tr>';

    var todRows = byTime.map(function (b) {

             b.ok + ' of ' + b.total + '</td></tr>';

    var logRows = log.map(function (d) {

        '<div><b>' + pct(s.rate) + '%</b>taken</div>' +
        '<div><b>' + s.taken + '</b>on time</div>' +
        '<div><b>' + s.late + '</b>late</div>' +
        '<div><b>' + s.missed + '</b>missed</div>' +
        '<div><b>' + s.skipped + '</b>skipped</div></div>' +
        '<p>Based on ' + s.resolved + ' scheduled doses whose window had closed at the time of printing. ' +
        'A dose counts as taken when the dispenser released it and the pill was physically removed from the cup.</p></div>' +

        '<th>Date</th><th>Medication</th><th>Scheduled</th><th>Picked up</th><th>Status</th>' +

        (log.length >= 60 ? '<p>Showing the 60 most recent doses in this range.</p>' : '') + '</div>' +

      '<div class="print-foot"><p><b>Demo — simulated data.</b> This document was produced by a ' +

  function exportSummary() {
    buildPrintSummary();
    announce('Print summary prepared. Opening the print dialog.');
    // A frame lets the print DOM paint before the (blocking) print dialog opens.
    requestAnimationFrame(function () { setTimeout(function () { window.print(); }, 60); });

  /* ==================================================================
     DEMO SIMULATOR
     Fires real state changes into the live app. Everything routes through
     commit(), so a dispense triggered on Home is already true on Cartridges
     before you navigate there — nothing is faked per-screen.
     ================================================================== */
  function pendingDose(pid, statuses) {
    var order = { due:0, dispensed_not_taken:1, upcoming:2 };
    return DB.getDoseLog(pid)
      .filter(function (d) { return statuses.indexOf(d.status) !== -1; })
      .sort(function (a, b) {
        var s = order[a.status] - order[b.status];
        return s !== 0 ? s : a.scheduledTs - b.scheduledTs;
      })[0] || null;
  }

  function demoDispense() {
    var pid = state.patientId;
    var d = pendingDose(pid, ['due', 'upcoming']);
    if (!d) return toast('No dose left to dispense today. Try "Reset demo".');
    var med = DB.getMedication(d.medId);

    commit(function () {
      d.status = 'dispensed_not_taken';
      d.dispensedTs = now();
      d.pickupTs = null;
      consumeFromCartridge(pid, d.cartridge, d.qty);
      state.lastDispensedId = d.id;
      var dev = DB.getDevice(pid);
      syncCupState(pid);
      dev.carouselIndex = d.cartridge;
      // Rotate the ring so the active cartridge sits under the fixed chute.
      state.carouselSpin = -d.cartridge * 45;
      state.selectedCartridge = d.cartridge;
      pushAlert(pid, 'warning', med.name + ' is waiting in the cup',
        'The dispenser released the ' + fmtHHMM(d.scheduled) + ' dose and it has not been picked up.',
        'Call ' + firstName(pid) + ', or mark it skipped if the dose is not needed.');
    }, {
      toast: med.name + ' dispensed to the cup.',
      announce: med.name + ' ' + med.strength + ' dispensed into the cup and waiting to be picked up.',
      assertive: true
    });
  }

  function markPickedUp(doseId) {
    var d = DB.getDose(doseId);
    if (!d) return;
    var med = DB.getMedication(d.medId);
    var pid = d.patientId;

    commit(function () {
      // The hardware distinguishes these two by timestamp delta, not by a flag,
      // so the app derives the same way rather than being told.
      var wasLate = now() > d.scheduledTs + WINDOW_RULES.lateAfter * MS_MIN;
      if (!d.dispensedTs) { d.dispensedTs = now(); consumeFromCartridge(pid, d.cartridge, d.qty); }
      d.pickupTs = now();
      d.status = wasLate ? 'late' : 'taken';
      syncCupState(pid);
      DB.alerts.forEach(function (a) {
        if (a.patientId === pid && a.title.indexOf(med.name) === 0) a.read = true;
      });
    }, {
      toast: med.name + ' marked as picked up.',
      announce: med.name + ' picked up. The cup is clear.'
    });
    if (modalIsOpen()) closeModal();
  }

  function skipDose(doseId) {
    var d = DB.getDose(doseId);
    if (!d) return;
    var med = DB.getMedication(d.medId);
    commit(function () {
      d.status = 'skipped';
      d.pickupTs = null;
      syncCupState(d.patientId);
    }, {
      toast: med.name + ' dose skipped.',
      announce: med.name + ' dose marked as skipped. It will not count against adherence.'
    });
    if (modalIsOpen()) closeModal();
  }

  /* Prefers the dose the presenter just dispensed, so "trigger dispense ->
     simulate pickup" completes the lifecycle on the same pill instead of
     silently acting on an older one still sitting in the cup. */
  function demoPickup() {
    var pid = state.patientId;
    var waiting = DB.getDoseLog(pid).filter(function (x) { return x.status === 'dispensed_not_taken'; });
    if (!waiting.length) return toast('Nothing is waiting in the cup. Trigger a dispense first.');
    var d = waiting.filter(function (x) { return x.id === state.lastDispensedId; })[0] || waiting[0];
    markPickedUp(d.id);
  }

  function demoMissed() {
    var pid = state.patientId;
    var d = pendingDose(pid, ['due', 'dispensed_not_taken', 'upcoming']);
    if (!d) return toast('No open dose to miss. Try "Reset demo".');
    var med = DB.getMedication(d.medId);

    commit(function () {
      if (!d.dispensedTs) { d.dispensedTs = d.scheduledTs; consumeFromCartridge(pid, d.cartridge, d.qty); }
      d.status = 'missed';
      d.pickupTs = null;
      syncCupState(pid);
      pushAlert(pid, 'urgent', med.name + ' missed',
        'The ' + fmtHHMM(d.scheduled) + ' dose window closed with no pickup.',
        'Check on ' + firstName(pid) + ' and consider moving the reminder earlier.');
    }, {
      toast: med.name + ' marked as missed.',
      announce: med.name + ' missed. An urgent alert has been raised.',
      assertive: true
    });
  }

  function demoToggleDevice() {
    var pid = state.patientId, dev = DB.getDevice(pid);
    commit(function () {
      dev.online = !dev.online;
      dev.lastSyncOffsetMin = dev.online ? 1 : dev.lastSyncOffsetMin;
      if (dev.online) {
        pushAlert(pid, 'informational', 'Dispenser back online',
          dev.serial + ' reconnected and synced.',
          'No action needed. Doses missed while offline stay in the log.');
      } else {
        pushAlert(pid, 'urgent', 'Dispenser is offline',
          dev.serial + ' stopped reporting.',
          'Check the unit has power and is in Wi-Fi range.');
      }
    }, {
      toast: 'Dispenser is now ' + (dev.online ? 'online' : 'offline') + '.',
      announce: 'Dispenser for ' + firstName(pid) + ' is now ' + (dev.online ? 'online' : 'offline') + '.',
      assertive: !dev.online
    });
  }

  function demoLowCartridge() {
    var pid = state.patientId;
    // Pick the fullest cartridge so the drop is unmistakable on screen.
    var target = DB.getCartridges(pid)
      .filter(function (c) { return c.medId && !isLow(pid, c.position); })
      .sort(function (a, b) { return (daysRemaining(pid, b.position) || 0) - (daysRemaining(pid, a.position) || 0); })[0];
    if (!target) return toast('Every loaded cartridge is already low.');
    var med = DB.getMedication(target.medId);

    commit(function () {
      target.count = Math.max(1, dailyUse(pid, target.position) * 3);
      state.selectedCartridge = target.position;
      pushAlert(pid, 'informational', med.name + ' cartridge is low',
        'Cartridge ' + target.position + ' is down to ' + target.count + ' pills, about 3 days.',
        'Refill it, then log the refill so the estimate resets.');
    }, {
      toast: med.name + ' dropped to ' + target.count + ' pills.',
      announce: med.name + ' cartridge is low, about three days remaining.'
    });
  }

  function demoJump(hours) {
    commit(function () {
      state.clockMs += hours * MS_HOUR;
      // An offline unit has not synced during the jump; an online one has.
      DB.getPatients().forEach(function (p) {
        var dev = DB.getDevice(p.id);
        if (!dev.online) dev.lastSyncOffsetMin += hours * 60;
        else dev.lastSyncOffsetMin = Math.min(dev.lastSyncOffsetMin, 4);
      });
    }, {
      toast: 'Clock moved forward ' + hours + ' hour' + (hours === 1 ? '' : 's') + ' to ' + fmtClock(state.clockMs) + '.',
      announce: 'App clock is now ' + fmtClock(state.clockMs) + ' on ' + fmtDate(state.clockMs) + '.'
    });
  }

  var SNAPSHOT = null;
  function takeSnapshot() {
    SNAPSHOT = JSON.parse(JSON.stringify({
      medications: DB.medications, cartridges: DB.cartridges,
      devices: DB.devices, alerts: DB.alerts, settings: DB.settings
    }));
  }
  function demoReset() {
    commit(function () {
      var s = JSON.parse(JSON.stringify(SNAPSHOT));
      DB.medications = s.medications; DB.cartridges = s.cartridges;
      DB.devices = s.devices; DB.alerts = s.alerts; DB.settings = s.settings;
      state.clockMs = INITIAL_CLOCK;
      state.carouselSpin = 0;
      state.selectedCartridge = 4;
      state.scanIndex = 0;
      state.historyRange = 30;
      DB.rebuild(INITIAL_CLOCK);
    }, { toast: 'Demo reset to the starting state.', announce: 'Demo reset to the starting state.' });
  }

  function renderDemoPanel() {
    var dev = DB.getDevice(state.patientId);
    $('#demo-body').innerHTML =
      '<div class="demo-group"><p class="label">Dose lifecycle</p><div class="demo-btns">' +
        '<button class="btn btn--primary" type="button" data-demo="dispense">Trigger dispense</button>' +
        '<button class="btn btn--secondary" type="button" data-demo="pickup">Simulate pickup</button>' +
        '<button class="btn btn--secondary" type="button" data-demo="missed">Simulate missed dose</button>' +
      '</div><p class="demo-note">Acts on ' + esc(firstName(state.patientId)) + '’s next open dose.</p></div>' +

      '<div class="demo-group"><p class="label">Device</p><div class="demo-btns demo-btns--split">' +
        '<button class="btn btn--secondary" type="button" data-demo="device">' +
          (dev.online ? 'Take offline' : 'Bring online') + '</button>' +
        '<button class="btn btn--secondary" type="button" data-demo="low">Drop cartridge low</button>' +
      '</div></div>' +

      '<div class="demo-group"><p class="label">Clock — now ' + esc(fmtClock(now())) + '</p>' +
      '<div class="demo-btns demo-btns--three">' +
        '<button class="btn btn--secondary" type="button" data-demo="jump1">+1 h</button>' +
        '<button class="btn btn--secondary" type="button" data-demo="jump4">+4 h</button>' +
        '<button class="btn btn--secondary" type="button" data-demo="jump12">+12 h</button>' +
      '</div><p class="demo-note">Open doses resolve the way the firmware would when their window closes.</p></div>' +

      '<div class="demo-group"><p class="label">Start over</p><div class="demo-btns">' +
        '<button class="btn btn--secondary" type="button" data-demo="reset">Reset demo</button>' +
      '</div></div>';
  }

  function toggleDemo(open) {
    state.demoOpen = open === undefined ? !state.demoOpen : open;
    $('#demo-panel').hidden = !state.demoOpen;
    $('#demo-fab').setAttribute('aria-expanded', String(state.demoOpen));
    if (state.demoOpen) {
      renderDemoPanel();
      var b = $('#demo-body button'); if (b) b.focus();
    } else {
      $('#demo-fab').focus();
    }
  }

  var DEMO_ACTIONS = {
    dispense: demoDispense, pickup: demoPickup, missed: demoMissed,
    device: demoToggleDevice, low: demoLowCartridge, reset: demoReset,
    jump1: function () { demoJump(1); },
    jump4: function () { demoJump(4); },
    jump12: function () { demoJump(12); }
  };

  /* ==================================================================
     RENDER + EVENTS
     ================================================================== */
  var VIEW_FNS = {
    home: renderHome, schedule: renderSchedule, cartridges: renderCartridges,
    history: renderHistory, alerts: renderAlerts, settings: renderSettings,
    patient: renderPatient
  };

  function render() {
    renderNav();
    renderPatientSeg();
    (VIEW_FNS[state.view] || renderHome)();
    ALL_VIEWS.forEach(function (id) {
      var node = $('#view-' + id);
      if (node) node.hidden = (id !== state.view);
    });
    if (state.demoOpen) renderDemoPanel();
    // Kept current on every render so a plain Ctrl+P prints something sensible,
    // not just the "Export summary" path.
    buildPrintSummary();
  }

  function attr(e, name) {
    var node = e.target.closest ? e.target.closest('[' + name + ']') : null;
    return node ? { node: node, value: node.getAttribute(name) } : null;
  }

  function onClick(e) {
    var a;

    if ((a = attr(e, 'data-modal-close'))) { closeModal(); return; }
    if (e.target.id === 'modal-scrim' || e.target.id === 'modal-close') { closeModal(); return; }

    if ((a = attr(e, 'data-go')))      { closeModal(); go(a.value); return; }
    if ((a = attr(e, 'data-patient'))) {
      state.patientId = a.value;
      state.selectedCartridge = 0;
      state.carouselSpin = 0;
      commit(null, { announce: 'Now viewing ' + DB.getPatient(a.value).name + '.' });
      return;
    }

    if ((a = attr(e, 'data-pickup')))  { markPickedUp(a.value); return; }
    if ((a = attr(e, 'data-skip')))    { skipDose(a.value); return; }
    if ((a = attr(e, 'data-dose')))    { openDoseDetail(a.value); return; }

    if ((a = attr(e, 'data-scan')))       { startScan(); return; }
    if ((a = attr(e, 'data-usescan')))    { openMedForm(null); return; }
    if ((a = attr(e, 'data-addmed')))     { openMedForm(null); return; }
    if ((a = attr(e, 'data-editmed')))    { openMedForm(a.value); return; }
    if ((a = attr(e, 'data-delmed')))     { confirmRemoveMed(a.value); return; }
    if ((a = attr(e, 'data-savemed')))    { saveMedForm(); return; }
    if ((a = attr(e, 'data-confirmsync'))){ runSync(); return; }

    if ((a = attr(e, 'data-cart')))   { state.selectedCartridge = +a.value; render(); return; }
    if ((a = attr(e, 'data-refill'))) { refillCartridge(+a.value); return; }
    if ((a = attr(e, 'data-assign'))) { state.prefill = null; openMedForm(null); return; }

    if ((a = attr(e, 'data-range')))      { state.historyRange = +a.value; render(); return; }
    if ((a = attr(e, 'data-print')))      { exportSummary(); return; }
    if ((a = attr(e, 'data-alertscope'))) { state.alertScope = a.value; render(); return; }

    if ((a = attr(e, 'data-alertread'))) {
      var id = a.value;
      commit(function () {
        DB.alerts.forEach(function (x) { if (x.id === id) x.read = true; });
      }, { announce: 'Alert marked as read.' });
      return;
    }
    if ((a = attr(e, 'data-allread'))) {
      commit(function () { DB.alerts.forEach(function (x) { x.read = true; }); },
             { toast: 'All alerts marked read.', announce: 'All alerts marked as read.' });
      return;
    }

    if ((a = attr(e, 'data-addcontact')) || (a = attr(e, 'data-contact'))) {
      openModal('Care team',
        '<p>Editing care team contacts is part of the production app and is not wired up in this demo build.</p>' +
        '<p class="meta" style="margin-top:var(--sp-3)">The escalation ladder above already shows who would be ' +
        'contacted and in what order.</p>',
        '<button class="btn btn--primary" type="button" data-modal-close="1">Got it</button>');
      return;
    }

    if ((a = attr(e, 'data-demo'))) { (DEMO_ACTIONS[a.value] || function () {})(); return; }
  }

  function onChange(e) {
    var t = e.target, st = DB.getSettings();

    if (t.hasAttribute('data-setting')) {
      var map = { escNudge:'nudgePatient', escPrimary:'notifyPrimary', escSecondary:'notifySecondary' };
      var key = map[t.getAttribute('data-setting')];
      var v = Math.max(0, parseInt(t.value, 10) || 0);
      commit(function () { st.escalation[key] = v; },
             { toast: 'Escalation updated.', announce: 'Escalation step set to ' + v + ' minutes.' });
      return;
    }
    if (t.hasAttribute('data-trigger')) {
      var k = t.getAttribute('data-trigger'), on = t.checked;
      commit(function () { st.triggers[k] = on; },
             { announce: 'Notification ' + (on ? 'enabled' : 'disabled') + '.' });
      return;
    }
    if (t.hasAttribute('data-quiet')) {
      var q = t.getAttribute('data-quiet');
      var val = q === 'enabled' ? t.checked : t.value;
      commit(function () { st.quietHours[q] = val; }, { announce: 'Quiet hours updated.' });
      return;
    }
  }

  function onKeydown(e) {
    if (e.key === 'Escape') {
      if (modalIsOpen()) { closeModal(); return; }
      if (state.demoOpen) { toggleDemo(false); return; }
    }
    trapFocus(e);

    // SVG <g> and <tr> are not natively activatable, so give them the same
    // Enter/Space behaviour a button would have.
    if (e.key === 'Enter' || e.key === ' ') {
      var t = e.target;
      if (t.classList && (t.classList.contains('cart-hit') || t.classList.contains('tbl__row'))) {
        e.preventDefault();
        t.dispatchEvent(new MouseEvent('click', { bubbles: true }));
      }
    }
  }

  /* ------------------------------------------------------------------ boot */
  function boot() {
    DB.seedDoseLog(INITIAL_CLOCK);
    takeSnapshot();

    state.alertScope = 'all';
    state.view = readHash();

    $('#brand-mark').innerHTML = logoMark(34);
    $('#demo-fab-icon').innerHTML = icon('sliders', 18);
    var gear = $('#topbar-settings');
    if (gear) gear.innerHTML = icon('settings', 18) + '<span class="sr-only">Settings</span>';

    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('keydown', onKeydown);
    $('#demo-fab').addEventListener('click', function () { toggleDemo(); });
    $('#demo-close').addEventListener('click', function () { toggleDemo(false); });

    if (HASH_ROUTING) window.addEventListener('hashchange', function () {
      var id = readHash();
      if (id !== state.view) { state.view = id; render(); }
    });

    if (HASH_ROUTING && !location.hash) location.hash = '#/home';
    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})();
</script>
</body>
