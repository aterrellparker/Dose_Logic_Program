<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Dose Logic — Caregiver (Demo)</title>
<meta name="description" content="Dose Logic caregiver companion app — demo build with simulated data.">
<!-- Favicon is the carousel mark inlined as a data: URI. No file request, no network. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%23ffffff'/%3E%3Cpath d='M32 32L22.05 7.98A26 26 0 0 1 41.95 7.98Z' fill='%23CC0000'/%3E%3Cg stroke='%231A1A1A' stroke-width='2.6' fill='none' stroke-linecap='round'%3E%3Ccircle cx='32' cy='32' r='26'/%3E%3Cpath d='M32 32L22.05 7.98M32 32L41.95 7.98M32 32L56.02 22.05M32 32L56.02 41.95M32 32L41.95 56.02M32 32L22.05 56.02M32 32L7.98 41.95M32 32L7.98 22.05'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ==========================================================================
   DOSE LOGIC — design tokens
   Palette is fixed by the brand deck. No hues outside this set.
   The *-tint values are lightened versions of the three status hues, not new
   hues: the status table calls for "tinted background" chips, and the tint has
   to exist as a token so it cannot drift per-component.
   ========================================================================== */
:root{
  /* Brand */
  --dl-red:        #CC0000;   /* logo mark + missed dose ONLY. Nothing else. */
  --dl-ink:        #1A1A1A;   /* primary text, primary buttons */

  /* Neutrals */
  --dl-slate:      #4C555C;   /* secondary text, labels */
  --dl-mute:       #7A848B;   /* icons, borders, disabled — NOT body text (3.8:1) */
  --dl-line:       #DDE2E5;   /* borders, dividers, chart gridlines */
  --dl-surface:    #F3F5F6;   /* page background */
  --dl-card:       #FFFFFF;   /* raised surfaces */

  /* Status — three hues only */
  --dl-green:      #157F3F;
  --dl-amber:      #B36B00;
  --dl-amber-fill: #F5A623;   /* solid fill, dispensed_not_taken only */

  /* Status tints (same hues, lightened for chip backgrounds) */
  --dl-green-tint: #EFF7F2;
  --dl-amber-tint: #FBF2E2;
  --dl-red-tint:   #FCECEC;
  --dl-ink-tint:   #EDEFF0;

  /* Type scale — Arial-first system stack, no web font request */
  --dl-font: Arial, "Helvetica Neue", Helvetica, "Segoe UI", system-ui, sans-serif;
  --fs-label:  0.8125rem;  /* 13px — uppercase section labels only */
  --fs-meta:   0.875rem;   /* 14px — timestamps, captions */
  --fs-body:   1.0625rem;  /* 17px — body floor */
  --fs-md:     1.1875rem;  /* 19px */
  --fs-lg:     1.5rem;     /* 24px */
  --fs-xl:     2rem;       /* 32px */
  --fs-data:   2.75rem;    /* 44px — the numbers people scan for */
  --fs-hero:   3.5rem;     /* 56px — next-dose time */

  /* Space + shape */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;
  --r-sm: 4px;  --r-md: 8px;  --r-lg: 14px; --r-pill: 999px;
  --shadow: 0 1px 2px rgba(26,26,26,.05), 0 6px 18px -10px rgba(26,26,26,.22);
  --tap: 44px;                       /* minimum touch target — older users */
  --nav-w: 244px;
}

/* ===== Reset ============================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body,h1,h2,h3,h4,p,figure,ul,ol,dl,dd,fieldset{margin:0}
ul,ol{padding:0;list-style:none}
fieldset{border:0;padding:0;min-width:0}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
table{border-collapse:collapse;width:100%}

body{
  font-family:var(--dl-font);
  font-size:var(--fs-body);
  line-height:1.5;
  color:var(--dl-ink);
  background:var(--dl-surface);
  -webkit-font-smoothing:antialiased;
}

/* ===== Focus ============================================================= */
/* Ink ring + offset so it reads on both --dl-surface and --dl-card without
   introducing a focus hue outside the fixed palette. */
:focus{outline:none}
:focus-visible{outline:3px solid var(--dl-ink);outline-offset:2px;border-radius:var(--r-sm)}
.skip-link{
  position:absolute;left:var(--sp-4);top:-100px;z-index:200;
  background:var(--dl-ink);color:var(--dl-card);
  padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);font-weight:700;
  text-decoration:none;transition:top .12s ease;
}
.skip-link:focus-visible{top:var(--sp-4)}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ===== Typography ======================================================== */
h1,h2,h3,h4{line-height:1.2;letter-spacing:-.01em;font-weight:700}
h1{font-size:var(--fs-xl)}
h2{font-size:var(--fs-lg)}
h3{font-size:var(--fs-md)}
.label{
  font-size:var(--fs-label);font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dl-slate);
}
.meta{font-size:var(--fs-meta);color:var(--dl-slate)}
.num{font-variant-numeric:tabular-nums}
.big-num{
  font-size:var(--fs-data);font-weight:700;letter-spacing:-.03em;
  line-height:1;font-variant-numeric:tabular-nums;
}

/* ===== Logo ============================================================== */
.lockup{display:flex;align-items:center;gap:var(--sp-3);text-decoration:none;color:inherit}
.lockup .wordmark{
  font-weight:700;font-size:var(--fs-md);letter-spacing:-.025em;
  color:var(--dl-ink);white-space:nowrap;
}
.dl-mark{flex:none}
/* Loading indicator: the filled wedge STEPS 45 degrees at a time, because that
   is what the NEMA-17 does. A smooth spin would misrepresent the mechanism. */
.dl-mark--stepping{animation:dl-step 2.8s steps(8,end) infinite}
@keyframes dl-step{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* ===== App shell ========================================================= */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:var(--sp-4);
  padding:var(--sp-3) var(--sp-5);
  background:var(--dl-card);border-bottom:1px solid var(--dl-line);
}
.topbar__spacer{flex:1}
.demo-badge{
  display:inline-flex;align-items:center;gap:var(--sp-2);
  font-size:var(--fs-meta);font-weight:700;
  color:var(--dl-ink);background:var(--dl-ink-tint);
  border:1px solid var(--dl-line);
  padding:6px var(--sp-3);border-radius:var(--r-pill);white-space:nowrap;
}
.demo-badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dl-ink);flex:none}
.shell{flex:1;display:flex;align-items:flex-start}

/* Side nav (desktop) */
.sidenav{
  width:var(--nav-w);flex:none;position:sticky;top:61px;
  height:calc(100vh - 61px);overflow-y:auto;
  padding:var(--sp-5) var(--sp-3);
  background:var(--dl-card);border-right:1px solid var(--dl-line);
}
.sidenav__group+.sidenav__group{margin-top:var(--sp-5);padding-top:var(--sp-5);border-top:1px solid var(--dl-line)}
.sidenav .label{padding:0 var(--sp-3) var(--sp-2)}
.navlink{
  display:flex;align-items:center;gap:var(--sp-3);width:100%;
  min-height:var(--tap);padding:var(--sp-2) var(--sp-3);
  border-radius:var(--r-md);color:var(--dl-slate);font-weight:600;text-align:left;
}
.navlink:hover{background:var(--dl-surface);color:var(--dl-ink)}
.navlink[aria-current="page"]{background:var(--dl-ink);color:var(--dl-card)}
.navlink[aria-current="page"] .navlink__icon{color:var(--dl-card)}
.navlink__icon{color:var(--dl-mute);flex:none}
.navlink:hover .navlink__icon{color:var(--dl-ink)}
.navlink__count{
  margin-left:auto;font-size:var(--fs-meta);font-weight:700;
  background:var(--dl-ink);color:var(--dl-card);
  min-width:22px;height:22px;padding:0 6px;border-radius:var(--r-pill);
  display:inline-flex;align-items:center;justify-content:center;
}
.navlink[aria-current="page"] .navlink__count{background:var(--dl-card);color:var(--dl-ink)}
.navlink--alt{border:1px dashed var(--dl-line)}

/* Main */
.main{flex:1;min-width:0;padding:var(--sp-6) var(--sp-6) var(--sp-8)}
.view[hidden]{display:none}
.view__head{margin-bottom:var(--sp-5)}
.view__head p{color:var(--dl-slate);margin-top:var(--sp-2);max-width:62ch}

/* Bottom tab bar (mobile) */
.tabbar{
  display:none;position:sticky;bottom:0;z-index:60;
  background:var(--dl-card);border-top:1px solid var(--dl-line);
  padding:var(--sp-1) var(--sp-2) calc(var(--sp-1) + env(safe-area-inset-bottom,0px));
}
.tabbar__list{display:flex}
.tabbar__list li{flex:1}
.tablink{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;width:100%;min-height:var(--tap);padding:var(--sp-2) 2px;
  font-size:11px;font-weight:700;color:var(--dl-slate);border-radius:var(--r-md);
}
.tablink[aria-current="page"],
.tablink[aria-current="page"] .tablink__icon{color:var(--dl-ink)}
.tablink__icon{color:var(--dl-mute)}
.tablink__dot{
  position:absolute;top:6px;left:50%;margin-left:6px;
  width:8px;height:8px;border-radius:50%;background:var(--dl-ink);
}

/* ===== Surfaces =========================================================
   Deliberately NOT one uniform rounded-card system. Three levels:
   .panel  = plain bordered block, the workhorse
   .slab   = flat ink block, used once per screen for the primary reading
   .rail   = borderless grouped list, no shadow, for dense data
   ======================================================================== */
.panel{
  background:var(--dl-card);border:1px solid var(--dl-line);
  border-radius:var(--r-lg);padding:var(--sp-5);
}
.panel--flush{padding:0;overflow:hidden;min-width:0}
.panel__head{
  display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
  padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--dl-line);
}
.panel__head h2,.panel__head h3{margin-right:auto}
.panel__body{padding:var(--sp-5)}
.slab{background:var(--dl-ink);color:var(--dl-card);border-radius:var(--r-lg);padding:var(--sp-6)}
.slab .label{color:rgba(255,255,255,.72)}
.rail{background:var(--dl-card);border:1px solid var(--dl-line);border-radius:var(--r-lg);overflow:hidden}
.rail>*+*{border-top:1px solid var(--dl-line)}

.grid{display:grid;gap:var(--sp-5)}
/* Grid and flex items default to min-width:auto, which lets a wide table push
   the whole page sideways instead of scrolling inside its own box. */
.grid>*,.stack>*{min-width:0}
.grid--home{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
.grid--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid--3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stack{display:grid;gap:var(--sp-5)}
.row{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap}
.row--tight{gap:var(--sp-2)}
.push{margin-left:auto}

/* ===== Buttons =========================================================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
  min-height:var(--tap);padding:var(--sp-2) var(--sp-4);
  border-radius:var(--r-md);font-weight:700;font-size:var(--fs-body);
  border:1px solid transparent;text-decoration:none;white-space:nowrap;
  transition:background-color .12s ease,border-color .12s ease,color .12s ease;
}
.btn--primary{background:var(--dl-ink);color:var(--dl-card)}
.btn--primary:hover{background:#000}
.btn--secondary{background:var(--dl-card);color:var(--dl-ink);border-color:var(--dl-line)}
.btn--secondary:hover{border-color:var(--dl-slate);background:var(--dl-surface)}
.btn--ghost{background:transparent;color:var(--dl-slate);padding-inline:var(--sp-3)}
.btn--ghost:hover{background:var(--dl-surface);color:var(--dl-ink)}
.btn--onink{background:var(--dl-card);color:var(--dl-ink)}
.btn--onink:hover{background:var(--dl-line)}
/* Still 44px tall: "small" here means quieter type and tighter side padding,
   never a smaller hit area — the users are older and often on a tablet. */
.btn--sm{min-height:var(--tap);font-size:var(--fs-meta);padding:var(--sp-1) var(--sp-3)}
.btn--block{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{
  opacity:1;background:var(--dl-surface);color:var(--dl-mute);
  border-color:var(--dl-line);cursor:not-allowed;
}
.btn__icon{flex:none}
/* Hit-area shim: small controls keep a 44px target without a 44px box. */
.hit{position:relative}
.hit::after{content:"";position:absolute;inset:50% 50%;width:var(--tap);height:var(--tap);transform:translate(-50%,-50%)}

/* Segmented control — patient selector + range filters */
.seg{display:inline-flex;background:var(--dl-surface);border:1px solid var(--dl-line);border-radius:var(--r-md);padding:3px;gap:3px}
.seg__btn{
  min-height:var(--tap);padding:0 var(--sp-3);border-radius:6px;
  font-weight:700;font-size:var(--fs-meta);color:var(--dl-slate);
}
.seg__btn[aria-pressed="true"]{background:var(--dl-card);color:var(--dl-ink);box-shadow:0 1px 2px rgba(26,26,26,.14)}

/* ===== Status chips =====================================================
   Urgency is carried by FILL, not hue: outline -> heavy outline -> tinted ->
   SOLID. That keeps all seven states apart for a colorblind viewer and from
   across a room. Every chip also carries a distinct icon shape.
   ======================================================================== */
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px var(--sp-3) 5px var(--sp-2);border-radius:var(--r-pill);
  font-size:var(--fs-meta);font-weight:700;white-space:nowrap;
  border:1px solid transparent;background:transparent;
}
.chip__icon{flex:none}
.chip--upcoming{border-color:var(--dl-mute);color:var(--dl-slate)}
.chip--upcoming .chip__icon{color:var(--dl-mute)}
.chip--due{border-color:var(--dl-ink);border-width:2px;color:var(--dl-ink);padding-block:4px}
.chip--due .chip__icon{color:var(--dl-ink)}
.chip--dispensed_not_taken{
  background:var(--dl-amber-fill);border-color:var(--dl-amber-fill);
  color:var(--dl-ink);box-shadow:0 1px 2px rgba(26,26,26,.18);
}
.chip--dispensed_not_taken .chip__icon{color:var(--dl-ink)}
.chip--taken{background:var(--dl-green-tint);border-color:var(--dl-green);color:var(--dl-green)}
.chip--taken .chip__icon{color:var(--dl-green)}
.chip--late{background:var(--dl-amber-tint);border-color:var(--dl-amber);color:var(--dl-ink)}
.chip--late .chip__icon{color:var(--dl-amber)}
.chip--missed{background:var(--dl-red-tint);border-color:var(--dl-red);color:var(--dl-red)}
.chip--missed .chip__icon{color:var(--dl-red)}
.chip--skipped{border-color:var(--dl-line);color:var(--dl-slate)}
.chip--skipped .chip__label{text-decoration:line-through}
.chip--skipped .chip__icon{color:var(--dl-mute)}

/* The only pulsing element in the app, on the only solid-filled state. */
.pulse-dot{width:9px;height:9px;border-radius:50%;background:var(--dl-ink);flex:none;animation:dl-pulse 1.8s ease-in-out infinite}
@keyframes dl-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.28;transform:scale(.72)}}

/* ===== Hero: next dose ================================================== */
.hero{display:grid;gap:var(--sp-5);grid-template-columns:minmax(0,1fr) auto;align-items:end}
.hero__time{font-size:var(--fs-hero);font-weight:700;letter-spacing:-.04em;line-height:.95;font-variant-numeric:tabular-nums}
.hero__count{font-size:var(--fs-lg);font-weight:700;color:rgba(255,255,255,.86);margin-top:var(--sp-2)}
.hero__meds{margin-top:var(--sp-4);display:grid;gap:6px}
.hero__med{display:flex;gap:var(--sp-3);align-items:baseline;font-size:var(--fs-md)}
.hero__med b{font-weight:700}
.hero__med span{color:rgba(255,255,255,.7);font-size:var(--fs-meta)}

/* ===== Attention strip ================================================== */
.attn{border:2px solid var(--dl-ink);border-radius:var(--r-lg);background:var(--dl-card);overflow:hidden}
.attn__head{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-5);background:var(--dl-ink);color:var(--dl-card)}
.attn__head .label{color:var(--dl-card)}
.attn__item{display:flex;gap:var(--sp-4);align-items:center;flex-wrap:wrap;padding:var(--sp-4) var(--sp-5)}
.attn__item+.attn__item{border-top:1px solid var(--dl-line)}
.attn__body{flex:1;min-width:200px}
.attn__body strong{display:block;font-size:var(--fs-md)}

/* ===== Timeline ========================================================= */
.tl{position:relative;padding-left:var(--sp-6)}
.tl::before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:2px;background:var(--dl-line)}
.tl__slot+.tl__slot{margin-top:var(--sp-5)}
/* The marker sits in the rail gutter created by .tl's left padding, not at the
   slot's own left edge — otherwise it lands on top of the dose time. */
.tl__marker{position:absolute;left:calc(-1 * var(--sp-6));width:24px;height:24px;border-radius:50%;background:var(--dl-card);border:2px solid var(--dl-line);display:grid;place-items:center}
.tl__slot--past .tl__marker{border-color:var(--dl-slate)}
.tl__slot--now .tl__marker{border-color:var(--dl-ink);border-width:3px}
.tl__slot--now .tl__marker::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--dl-ink)}
.tl__slot{position:relative}
.tl__time{font-size:var(--fs-md);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.tl__doses{margin-top:var(--sp-2);display:grid;gap:var(--sp-2)}
.tl__dose{
  display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
  width:100%;text-align:left;min-height:var(--tap);
  padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);border:1px solid var(--dl-line);
  background:var(--dl-card);
}
.tl__dose:hover{border-color:var(--dl-slate);background:var(--dl-surface)}
.tl__dose--flag{border-width:2px;border-color:var(--dl-ink)}
.tl__name{font-weight:700;flex:1;min-width:140px}
.tl__name small{display:block;font-weight:400;font-size:var(--fs-meta);color:var(--dl-slate)}
.tl__stamp{font-size:var(--fs-meta);color:var(--dl-slate);font-variant-numeric:tabular-nums}

/* ===== Device status line =============================================== */
.devline{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;font-size:var(--fs-meta);color:var(--dl-slate)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot--on{background:var(--dl-green)}
/* Offline is an attention state, not a missed dose, so it must not take red.
   Hollow-vs-filled carries it: online is a solid green dot, offline a hollow
   amber ring — still legible with the colour stripped out. */
.dot--off{background:transparent;border:2.5px solid var(--dl-amber)}
.devline b{color:var(--dl-ink);font-size:var(--fs-body)}
.devline__sep{color:var(--dl-line)}

/* ===== Carousel ========================================================= */
.carousel{display:grid;grid-template-columns:minmax(300px,440px) minmax(0,1fr);gap:var(--sp-6);align-items:start}
.carousel__stage{background:var(--dl-card);border:1px solid var(--dl-line);border-radius:var(--r-lg);padding:var(--sp-5)}
.carousel__svg{width:100%;height:auto}
/* The ring rotates in 45-degree steps to match the real indexing. Labels are
   counter-rotated by the same angle about their own centres so the text stays
   upright while the carousel turns under it. */
.carousel__ring{
  transform:rotate(var(--spin,0deg));transform-origin:200px 200px;
  transition:transform .7s cubic-bezier(.2,.9,.2,1);
}
.cart-label{
  transform:rotate(calc(-1 * var(--spin,0deg)));
  transition:transform .7s cubic-bezier(.2,.9,.2,1);
}
.cart-hit{cursor:pointer}
.cart-hit:focus-visible{outline:3px solid var(--dl-ink);outline-offset:2px}
.cart-wedge{transition:fill .2s ease}
.cart-list{display:grid;gap:var(--sp-2)}
.cart-row{
  display:flex;align-items:center;gap:var(--sp-3);width:100%;text-align:left;
  min-height:var(--tap);padding:var(--sp-3);border:1px solid var(--dl-line);
  border-radius:var(--r-md);background:var(--dl-card);
}
.cart-row:hover{border-color:var(--dl-slate);background:var(--dl-surface)}
.cart-row[aria-pressed="true"]{border-color:var(--dl-ink);border-width:2px;padding:11px}
.cart-row__pos{
  width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:var(--fs-meta);background:var(--dl-ink-tint);color:var(--dl-ink);
}
.cart-row__pos--empty{background:transparent;border:1px dashed var(--dl-mute);color:var(--dl-slate)}
.cart-row__name{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart-row__name small{display:block;font-weight:400;font-size:var(--fs-meta);color:var(--dl-slate)}
.cart-row__count{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.cart-row__count small{display:block;font-weight:400;font-size:var(--fs-meta);color:var(--dl-slate)}
.meter{height:6px;border-radius:3px;background:var(--dl-line);overflow:hidden;margin-top:6px}
.meter__fill{height:100%;background:var(--dl-ink)}
.meter__fill--low{background:var(--dl-amber)}
.flag-low{
  display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-meta);font-weight:700;
  color:var(--dl-ink);background:var(--dl-amber-tint);border:1px solid var(--dl-amber);
  padding:2px var(--sp-2);border-radius:var(--r-pill);
}

/* ===== Charts (all inline SVG generated from data) ====================== */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--dl-font);fill:var(--dl-slate)}
.chart .grid-line{stroke:var(--dl-line);stroke-width:1}
.chart .axis-label{font-size:12px}
.chart .bar-adh{fill:var(--dl-ink)}
.chart .bar-miss{fill:var(--dl-line)}
.chart .bar-low{fill:var(--dl-amber)}
.chart__legend{display:flex;gap:var(--sp-4);flex-wrap:wrap;font-size:var(--fs-meta);color:var(--dl-slate);margin-top:var(--sp-3)}
.chart__key{display:inline-flex;align-items:center;gap:6px}
.chart__swatch{width:12px;height:12px;border-radius:2px;flex:none}
.spark{width:100%;max-width:220px;height:auto}
.insight{
  border-left:3px solid var(--dl-ink);padding:var(--sp-2) 0 var(--sp-2) var(--sp-4);
  color:var(--dl-slate);font-size:var(--fs-meta);
}
.insight b{color:var(--dl-ink)}

/* ===== Forms ============================================================ */
.field{display:grid;gap:6px;margin-bottom:var(--sp-4)}
.field>label{font-size:var(--fs-meta);font-weight:700;color:var(--dl-slate)}
.field input[type=text],.field input[type=number],.field input[type=date],
.field input[type=time],.field select,.field textarea{
  min-height:var(--tap);width:100%;padding:var(--sp-2) var(--sp-3);
  border:1px solid var(--dl-line);border-radius:var(--r-md);background:var(--dl-card);
}
.field input:hover,.field select:hover{border-color:var(--dl-slate)}
.field__hint{font-size:var(--fs-meta);color:var(--dl-slate)}
.field__error{
  display:flex;gap:6px;align-items:flex-start;font-size:var(--fs-meta);font-weight:700;
  color:var(--dl-ink);background:var(--dl-amber-tint);border:1px solid var(--dl-amber);
  border-radius:var(--r-md);padding:var(--sp-2) var(--sp-3);
}
.field--invalid input,.field--invalid select{border-color:var(--dl-amber);border-width:2px}
.checks{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.check{
  display:inline-flex;align-items:center;gap:var(--sp-2);min-height:var(--tap);
  padding:var(--sp-2) var(--sp-3);border:1px solid var(--dl-line);
  border-radius:var(--r-md);background:var(--dl-card);cursor:pointer;font-weight:600;
}
.check input{width:18px;height:18px;accent-color:#1A1A1A;cursor:pointer}
.check:has(input:checked){border-color:var(--dl-ink);border-width:2px;padding:var(--sp-2) 11px}
.form-actions{display:flex;gap:var(--sp-3);flex-wrap:wrap;margin-top:var(--sp-5);padding-top:var(--sp-5);border-top:1px solid var(--dl-line)}

/* ===== Tables =========================================================== */
/* Wide data tables scroll inside their own box. The page body must never
   scroll horizontally — at 390px the dose log is simply wider than the phone. */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0;max-width:100%}
.tbl-wrap:focus-visible{outline:3px solid var(--dl-ink);outline-offset:-3px}
.tbl{font-size:var(--fs-meta);min-width:560px}
.tbl th{
  text-align:left;font-size:var(--fs-label);letter-spacing:.08em;text-transform:uppercase;
  color:var(--dl-slate);padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--dl-line);
}
.tbl td{padding:var(--sp-3);border-bottom:1px solid var(--dl-line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child,.tbl th:first-child{padding-left:var(--sp-5)}
.tbl td:last-child,.tbl th:last-child{padding-right:var(--sp-5)}
.tbl__row{cursor:pointer}
.tbl__row:hover{background:var(--dl-surface)}
.tbl__row td:first-child{font-weight:700;font-size:var(--fs-body)}

/* ===== Alerts =========================================================== */
.alert{display:flex;gap:var(--sp-4);padding:var(--sp-4) var(--sp-5);align-items:flex-start;background:var(--dl-card)}
.alert--unread{background:var(--dl-surface)}
.alert__sev{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--dl-line)}
.alert__sev--info{color:var(--dl-slate)}
.alert__sev--warning{color:var(--dl-amber);border-color:var(--dl-amber);background:var(--dl-amber-tint)}
/* Urgent covers missed doses AND offline devices, so the badge cannot be red
   without leaking red onto non-missed events. Severity is carried by weight
   instead: hairline -> amber tint -> heavy ink. */
.alert__sev--urgent{color:var(--dl-ink);border-color:var(--dl-ink);border-width:2px;background:var(--dl-ink-tint)}
.alert__main{flex:1;min-width:0}
.alert__title{font-weight:700;display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.alert__unread-dot{width:8px;height:8px;border-radius:50%;background:var(--dl-ink);flex:none}
.alert__what{color:var(--dl-slate);margin-top:2px}
.alert__do{margin-top:var(--sp-2);font-size:var(--fs-meta);font-weight:700}
.alert__time{font-size:var(--fs-meta);color:var(--dl-slate);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ===== Empty states ===================================================== */
.empty{text-align:center;padding:var(--sp-7) var(--sp-5);color:var(--dl-slate)}
.empty h3{color:var(--dl-ink);margin-bottom:var(--sp-2)}
.empty .btn{margin-top:var(--sp-4)}

/* ===== Modal / scanner ================================================== */
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:var(--sp-4)}
.modal__scrim{position:absolute;inset:0;background:rgba(26,26,26,.55)}
.modal__box{
  position:relative;background:var(--dl-card);border-radius:var(--r-lg);
  width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow);
}
.modal__head{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--dl-line)}
.modal__head h2{margin-right:auto;font-size:var(--fs-md)}
.modal__body{padding:var(--sp-5)}
.modal__foot{display:flex;gap:var(--sp-3);flex-wrap:wrap;padding:var(--sp-4) var(--sp-5);border-top:1px solid var(--dl-line)}

/* Viewfinder. Simulated only — the app never requests camera access. */
.scan{background:var(--dl-ink);border-radius:var(--r-md);aspect-ratio:4/3;position:relative;overflow:hidden;display:grid;place-items:center}
.scan__frame{position:absolute;inset:14% 10%;border-radius:var(--r-md)}
.scan__frame span{position:absolute;width:34px;height:34px;border:3px solid var(--dl-card)}
.scan__frame span:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:var(--r-md) 0 0 0}
.scan__frame span:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 var(--r-md) 0 0}
.scan__frame span:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 var(--r-md)}
.scan__frame span:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 var(--r-md) 0}
.scan__beam{position:absolute;left:10%;right:10%;height:2px;background:var(--dl-card);box-shadow:0 0 12px rgba(255,255,255,.85);animation:dl-scan 1.6s ease-in-out infinite}
@keyframes dl-scan{0%,100%{top:16%}50%{top:82%}}
.scan__hint{position:absolute;bottom:var(--sp-3);left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:var(--fs-meta)}
.scan__code{font-variant-numeric:tabular-nums;letter-spacing:.06em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-2) var(--sp-4);font-size:var(--fs-meta)}
.kv dt{color:var(--dl-slate);font-weight:700}
.kv dd{color:var(--dl-ink);font-weight:600}

/* Sync state after a schedule edit */
.sync{display:flex;align-items:center;gap:var(--sp-3);font-weight:700}
.notice{
  display:flex;gap:var(--sp-3);align-items:flex-start;
  border:1px solid var(--dl-line);border-left-width:3px;border-left-color:var(--dl-ink);
  background:var(--dl-card);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);
}
.notice--good{border-left-color:var(--dl-green);background:var(--dl-green-tint)}
.notice--warn{border-left-color:var(--dl-amber);background:var(--dl-amber-tint)}

/* ===== Toast ============================================================ */
.toasts{position:fixed;left:50%;bottom:var(--sp-5);transform:translateX(-50%);z-index:150;display:grid;gap:var(--sp-2);width:min(440px,calc(100vw - 32px))}
.toast{
  background:var(--dl-ink);color:var(--dl-card);border-radius:var(--r-md);
  padding:var(--sp-3) var(--sp-4);font-weight:600;font-size:var(--fs-meta);
  box-shadow:var(--shadow);animation:dl-toast .18s ease-out;
}
@keyframes dl-toast{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Demo controls ==================================================== */
.demo-fab{
  position:fixed;right:var(--sp-5);bottom:var(--sp-5);z-index:110;
  display:inline-flex;align-items:center;gap:var(--sp-2);
  min-height:var(--tap);padding:0 var(--sp-4);border-radius:var(--r-pill);
  background:var(--dl-ink);color:var(--dl-card);font-weight:700;box-shadow:var(--shadow);
}
.demo-panel[hidden]{display:none}
.demo-panel{
  position:fixed;right:var(--sp-5);bottom:calc(var(--sp-5) + var(--tap) + var(--sp-2));
  z-index:115;width:min(348px,calc(100vw - 32px));max-height:min(72vh,640px);overflow:auto;
  background:var(--dl-card);border:2px solid var(--dl-ink);border-radius:var(--r-lg);box-shadow:var(--shadow);
}
.demo-panel__head{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);background:var(--dl-ink);color:var(--dl-card);position:sticky;top:0}
.demo-panel__head h2{font-size:var(--fs-body);margin-right:auto}
.demo-panel__body{padding:var(--sp-4)}
.demo-group+.demo-group{margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px solid var(--dl-line)}
.demo-group .label{margin-bottom:var(--sp-2)}
.demo-btns{display:grid;gap:var(--sp-2)}
.demo-btns--split{grid-template-columns:1fr 1fr}
.demo-btns--three{grid-template-columns:repeat(3,1fr)}
.demo-note{font-size:var(--fs-meta);color:var(--dl-slate);margin-top:var(--sp-2)}

/* ===== Patient view =====================================================
   Visually distinct on purpose: inverted top rule, no side nav chrome,
   everything at least 24px. It must never be mistaken for the caregiver app.
   ======================================================================== */
.pv{max-width:760px;margin:0 auto;font-size:1.5rem;line-height:1.45}
.pv__banner{background:var(--dl-ink);color:var(--dl-card);border-radius:var(--r-lg);padding:var(--sp-5) var(--sp-6);margin-bottom:var(--sp-5)}
.pv__banner .label{color:rgba(255,255,255,.75);font-size:1rem}
.pv__banner h1{font-size:2.25rem;margin-top:var(--sp-2)}
.pv__card{background:var(--dl-card);border:2px solid var(--dl-line);border-radius:var(--r-lg);padding:var(--sp-6);margin-bottom:var(--sp-4)}
.pv__card--now{border-color:var(--dl-ink);border-width:3px}
.pv__time{font-size:3rem;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.pv__what{font-size:1.75rem;font-weight:700;margin-top:var(--sp-3)}
.pv__list{margin-top:var(--sp-3);display:grid;gap:var(--sp-2)}
.pv__list li{display:flex;gap:var(--sp-3);align-items:baseline}
.pv__list b{font-weight:700}
.pv__state{margin-top:var(--sp-4);display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap}
.pv .chip{font-size:1.25rem;padding:var(--sp-2) var(--sp-4)}
.pv .chip__icon{width:24px;height:24px}
.pv__btn{min-height:64px;font-size:1.375rem;padding:0 var(--sp-6)}

/* ===== Print ============================================================
   A real caregiver workflow: print the summary and take it to an appointment.
   The app chrome is dropped entirely and #print-only is revealed.
   ======================================================================== */
#print-only{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:11pt;color:#000}
  .topbar,.sidenav,.tabbar,.demo-fab,.demo-panel,.toasts,.skip-link,.modal,.no-print{display:none !important}
  .app,.shell,.main{display:block;padding:0;margin:0}
  #app-views{display:none !important}
  #print-only{display:block !important}
  .print-head{display:flex;align-items:flex-end;gap:12pt;border-bottom:2pt solid #000;padding-bottom:8pt;margin-bottom:14pt}
  .print-head h1{font-size:18pt}
  .print-head .meta{margin-left:auto;text-align:right;color:#000}
  .print-sec{margin-bottom:16pt;break-inside:avoid}
  .print-sec h2{font-size:13pt;border-bottom:1pt solid #999;padding-bottom:4pt;margin-bottom:8pt}
  .print-stats{display:flex;gap:24pt;margin-bottom:12pt}
  .print-stats div{border:1pt solid #999;padding:8pt 12pt}
  .print-stats b{display:block;font-size:20pt;line-height:1}
  .print-tbl{width:100%;font-size:10pt}
  .print-tbl th{text-align:left;border-bottom:1pt solid #000;padding:4pt 6pt;font-size:9pt;text-transform:uppercase}
  .print-tbl td{border-bottom:.5pt solid #ccc;padding:4pt 6pt}
  .print-foot{margin-top:18pt;padding-top:8pt;border-top:1pt solid #999;font-size:9pt;color:#333}
  .chart{max-width:100%}
  tr,.print-sec{page-break-inside:avoid}
}

/* ===== Responsive ======================================================= */
@media (max-width:1200px){
  .grid--home{grid-template-columns:minmax(0,1fr)}
  .carousel{grid-template-columns:minmax(0,1fr)}
  :root{--fs-hero:3rem}
}
/* Settings gear lives in the top bar on small screens only — six tabs is the
   practical limit at 390px, and Patient view keeps the sixth slot. */
#topbar-settings{display:none}

@media (max-width:900px){
  .sidenav{display:none}
  .tabbar{display:block}
  .topbar{flex-wrap:wrap}
  #patient-seg{order:4;width:100%}
  .topbar__spacer{order:2}
  .demo-badge{order:3}
  #topbar-settings{display:inline-flex;order:3;min-height:var(--tap);padding:0 var(--sp-3)}
  .main{padding:var(--sp-5) var(--sp-4) var(--sp-6)}
  .topbar{padding:var(--sp-3) var(--sp-4);gap:var(--sp-3)}
  .lockup .wordmark{display:none}       /* collapsed nav: mark alone */
  .grid--2,.grid--3{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr)}
  .demo-fab{bottom:calc(var(--sp-4) + 72px)}
  .demo-panel{bottom:calc(var(--sp-4) + 72px + var(--tap) + var(--sp-2));right:var(--sp-4)}
  .slab{padding:var(--sp-5)}
  .panel{padding:var(--sp-4)}
  .panel__head,.panel__body{padding:var(--sp-4)}
  .tbl td:first-child,.tbl th:first-child{padding-left:var(--sp-4)}
  .tbl td:last-child,.tbl th:last-child{padding-right:var(--sp-4)}
}
@media (max-width:520px){
  :root{--fs-hero:2.5rem;--fs-data:2.25rem;--fs-xl:1.625rem}
  .demo-btns--split,.demo-btns--three{grid-template-columns:1fr}
  .attn__item{padding:var(--sp-4)}
  .pv{font-size:1.375rem}
  .pv__banner,.pv__card{padding:var(--sp-5)}
  .seg{width:100%}
  .seg__btn{flex:1}
}

/* ===== Reduced motion ===================================================
   Motion in this app only ever explains a change, so under reduced-motion the
   change still happens — instantly — and nothing is lost.
   ======================================================================== */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
  .pulse-dot{animation:none;opacity:1}
  .scan__beam{animation:none;top:49%}
  .carousel__ring{transition:none}
}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<div class="app">

  <header class="topbar">
    <a class="lockup" href="#/home" aria-label="Dose Logic — go to Home">
      <span id="brand-mark" aria-hidden="true"></span>
      <span class="wordmark">Dose Logic</span>
    </a>

    <div class="seg no-print" role="group" aria-label="Select patient" id="patient-seg"></div>

    <span class="topbar__spacer"></span>
    <p class="demo-badge no-print">Demo — simulated data</p>
    <button class="btn btn--secondary no-print" id="topbar-settings" type="button" data-go="settings"></button>
  </header>

  <div class="shell">

    <nav class="sidenav no-print" aria-label="Main">
      <div class="sidenav__group">
        <p class="label" id="nav-care-label">Care</p>
        <ul aria-labelledby="nav-care-label" id="nav-primary"></ul>
      </div>
      <div class="sidenav__group">
        <p class="label" id="nav-alt-label">Other views</p>
        <ul aria-labelledby="nav-alt-label" id="nav-secondary"></ul>
      </div>
    </nav>

    <main class="main" id="main" tabindex="-1">
      <!-- Every screen lives in the DOM; the router toggles [hidden]. -->
      <div id="app-views">
        <section class="view" id="view-home"       aria-labelledby="h-home"></section>
        <section class="view" id="view-schedule"   aria-labelledby="h-schedule"   hidden></section>
        <section class="view" id="view-cartridges" aria-labelledby="h-cartridges" hidden></section>
        <section class="view" id="view-history"    aria-labelledby="h-history"    hidden></section>
        <section class="view" id="view-alerts"     aria-labelledby="h-alerts"     hidden></section>
        <section class="view" id="view-settings"   aria-labelledby="h-settings"   hidden></section>
        <section class="view" id="view-patient"    aria-labelledby="h-patient"    hidden></section>
      </div>

      <!-- Print-only summary. Populated on demand by "Export summary". -->
      <div id="print-only"></div>
    </main>

  </div>

  <nav class="tabbar no-print" aria-label="Main">
    <ul class="tabbar__list" id="nav-tabs"></ul>
  </nav>
</div>

<!-- Demo controls: one button, always reachable, collapsed by default. -->
<button class="demo-fab no-print" id="demo-fab" type="button"
        aria-expanded="false" aria-controls="demo-panel">
  <span id="demo-fab-icon" aria-hidden="true"></span>
  <span>Demo controls</span>
</button>

<aside class="demo-panel no-print" id="demo-panel" aria-labelledby="demo-panel-title" hidden>
  <div class="demo-panel__head">
    <h2 id="demo-panel-title">Demo controls</h2>
    <button class="btn btn--sm btn--onink" type="button" id="demo-close">Hide</button>
  </div>
  <div class="demo-panel__body" id="demo-body"></div>
</aside>

<div class="toasts no-print" id="toasts"></div>

<!-- Live regions: state changes fired by the simulator are not user-initiated,
     so they have to be announced. -->
<p class="sr-only" id="live-polite" role="status" aria-live="polite"></p>
<p class="sr-only" id="live-assertive" role="alert" aria-live="assertive"></p>

<div class="modal no-print" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal__scrim" id="modal-scrim"></div>
  <div class="modal__box">
    <div class="modal__head">
      <h2 id="modal-title">Dialog</h2>
      <button class="btn btn--sm btn--secondary" type="button" id="modal-close" aria-label="Close dialog">Close</button>
    </div>
    <div class="modal__body" id="modal-body"></div>
    <div class="modal__foot" id="modal-foot"></div>
  </div>
</div>

<script>
/* ==========================================================================
   DATA LAYER  (this was data.js — kept as one fenced section so the seam
   survives being inlined into a single file)

   HOW TO SWAP THIS FOR FIREBASE
   -----------------------------
   Nothing outside this section reads DL_DATA directly. Every read in the app
   goes through the accessor layer at the bottom of this block — getPatients(),
   getMedications(), getDoseLog(), getCartridges(), getDevice(), getAlerts(),
   lookupNDC(). To go live, rewrite only those functions to return Firestore
   documents (or promises, if you also make the render path async) and delete
   the seed builders above them. No view code changes.

   Everything here is fictional. No real patients, prescribers, or facilities.
   ========================================================================== */
(function (global) {
  'use strict';

  /* Deterministic PRNG. A seeded generator matters here because the adherence
     figures are quoted in the UI ("87%") — an unseeded Math.random would make
     the headline number drift on every refresh and contradict the copy. */
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var MS_MIN = 60000, MS_HOUR = 3600000, MS_DAY = 86400000;

  /* Dose window rules, in minutes after the scheduled time. These are the
     thresholds the ESP32 firmware uses too — keep them in sync with it. */
  var WINDOW = { dueFor: 30, lateAfter: 30, missedAfter: 120 };

  function ymd(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
           '-' + String(d.getDate()).padStart(2, '0');
  }
  function atTime(dateObj, hhmm) {
    var p = hhmm.split(':');
    var d = new Date(dateObj);
    d.setHours(+p[0], +p[1], 0, 0);
    return d.getTime();
  }

  /* ---- Patients -------------------------------------------------------- */
  var patients = [
    { id:'p1', name:'Margaret Ellison', age:78, pronouns:'she/her',
      living:'Lives alone', relationship:'Mother',
      seed:20260101, target:'~87% adherence' },
    { id:'p2', name:'Robert Chen', age:71, pronouns:'he/him',

  }
  /* Duration phrasing is deliberately coarse — a caregiver glancing at a hero
     number wants "in 4h 55m", not a live-ticking second count. */
  function fmtDuration(ms) {
    var mins = Math.round(Math.abs(ms) / MS_MIN);
    if (mins < 1) return 'now';
    if (mins < 60) return mins + ' min';
    var h = Math.floor(mins / 60), m = mins % 60;
    if (h < 24) return m ? h + 'h ' + m + 'm' : h + 'h';
    var d = Math.floor(h / 24);
    return d + (d === 1 ? ' day' : ' days');
  }
  function fmtAgo(ts) {
    var delta = now() - ts;
    if (delta < 0) return 'in ' + fmtDuration(delta);
    if (delta < MS_MIN) return 'just now';
    return fmtDuration(delta) + ' ago';
  }
  function pct(n) { return Math.round(n * 100); }

  /* ------------------------------------------------------------------ icons */
  function svg(body, size, extra) {
    return '<svg class="' + (extra || '') + '" width="' + size + '" height="' + size +

           'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
           body + '</svg>';
  }

  var ICONS = {
    home:       '<path d="M2.5 6.8 8 2.4l5.5 4.4V13a.6.6 0 0 1-.6.6H9.6V10H6.4v3.6H3.1a.6.6 0 0 1-.6-.6Z"/>',
    schedule:   '<path d="M2.4 4h11.2M2.4 8h11.2M2.4 12h7.2"/>',

    history:    '<path d="M2.2 13.4h11.6M4.2 13.4V8.6M7.4 13.4V5M10.6 13.4v-3M13.4 13.4V6.6"/>',
    alerts:     '<path d="M8 2.2a3.9 3.9 0 0 0-3.9 3.9c0 3.3-1.3 4.4-1.3 4.4h10.4s-1.3-1.1-1.3-4.4A3.9 3.9 0 0 0 8 2.2Z"/><path d="M6.6 12.9a1.6 1.6 0 0 0 2.8 0"/>',
    settings:   '<path d="M2.4 4.6h4M9.4 4.6h4.2M2.4 11.4h2.2M7.6 11.4h6"/><circle cx="7.7" cy="4.6" r="1.7"/><circle cx="6" cy="11.4" r="1.7"/>',

    scan:       '<path d="M2.4 5.6V3.4a1 1 0 0 1 1-1h2.2M10.4 2.4h2.2a1 1 0 0 1 1 1v2.2M13.6 10.4v2.2a1 1 0 0 1-1 1h-2.2M5.6 13.6H3.4a1 1 0 0 1-1-1v-2.2"/><path d="M2.4 8h11.2"/>',
    print:      '<path d="M4.4 6.2V2.6h7.2v3.6"/><path d="M4.4 11.6H3a1 1 0 0 1-1-1V7.2a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v3.4a1 1 0 0 1-1 1h-1.4"/><path d="M4.4 9.6h7.2v3.8H4.4z"/>',

    close:      '<path d="M3.8 3.8l8.4 8.4M12.2 3.8l-8.4 8.4"/>',

    sliders:    '<path d="M2.4 4.6h4M9.4 4.6h4.2M2.4 11.4h2.2M7.6 11.4h6"/><circle cx="7.7" cy="4.6" r="1.7"/><circle cx="6" cy="11.4" r="1.7"/>',
    info:       '<circle cx="8" cy="8" r="5.9"/><path d="M8 7.4v3.4M8 5.2h.01"/>',
    warning:    '<path d="M8 2.6 14 12.8H2Z"/><path d="M8 6.6v2.8M8 11.2h.01"/>',
    urgent:     '<circle cx="8" cy="8" r="5.9" stroke-width="2"/><path d="M8 4.8v3.6M8 10.8h.01" stroke-width="2"/>',
    device:     '<rect x="3.4" y="2.4" width="9.2" height="11.2" rx="1.4"/><path d="M6 5.4h4M6 8h4"/><circle cx="8" cy="11" r="1"/>',
    cup:        '<path d="M4 5.4h8l-.9 7.2a1 1 0 0 1-1 .9H5.9a1 1 0 0 1-1-.9Z"/>'
  };

  /* Status icons are shape-first: each state is identifiable with the colour
     stripped out, which is the whole point of the fill-not-hue rule. */
  var STATUS_ICONS = {
    upcoming:            '<circle cx="8" cy="8" r="5"/>',
    due:                 '<circle cx="8" cy="8" r="5"/><circle cx="8" cy="8" r="1.8" fill="currentColor" stroke="none"/>',
    dispensed_not_taken: '<path d="M8 1.8v5.6M5.6 5.4 8 7.8l2.4-2.4"/><path d="M3.4 9h9.2l-.8 4.4a1 1 0 0 1-1 .8H5.2a1 1 0 0 1-1-.8Z"/>',
    taken:               '<path d="M3 8.4 6.4 11.8 13 5.2" stroke-width="2.1"/>',
    late:                '<circle cx="8" cy="8" r="5.6"/><path d="M8 4.8V8l2.2 1.5"/>',
    missed:              '<path d="M4.2 4.2 11.8 11.8M11.8 4.2 4.2 11.8" stroke-width="2.1"/>',
    skipped:             '<path d="M3.6 8h8.8" stroke-width="2.1"/>'
  };

  var STATUS_LABEL = {
    upcoming:'Upcoming', due:'Due now', dispensed_not_taken:'In the cup',
    taken:'Taken', late:'Late', missed:'Missed', skipped:'Skipped'
  };
  /* Spoken labels carry the meaning the colour and shape carry visually. */
  var STATUS_SR = {
    upcoming:'Upcoming, not due yet',
    due:'Due now, not yet dispensed',
    dispensed_not_taken:'Dispensed and still waiting in the cup — needs attention',
    taken:'Taken on time', late:'Taken late', missed:'Missed',
    skipped:'Skipped by caregiver'
  };

  function icon(name, size) { return svg(ICONS[name] || '', size || 18); }
  function statusIcon(status, size) {
    return svg(STATUS_ICONS[status] || '', size || 15, 'chip__icon');
  }

  function chip(status, opts) {
    opts = opts || {};
    var pulse = status === 'dispensed_not_taken' && !opts.noPulse
      ? '<span class="pulse-dot" aria-hidden="true"></span>' : '';
    return '<span class="chip chip--' + status + '">' +
             statusIcon(status, opts.iconSize) + pulse +
             '<span class="chip__label">' + esc(opts.label || STATUS_LABEL[status]) + '</span>' +
             '<span class="sr-only">. ' + esc(STATUS_SR[status]) + '</span>' +
           '</span>';
  }

  /* -------------------------------------------------------------- the mark */
  /* One function, one place to swap when the real logo file lands.
     Geometry is literal: 8 wedges at 45 degrees, matching the carousel's
     45-degrees-per-position indexing, filled wedge parked at 12 o'clock which
     is the dispense position over the chute. */
  function logoMark(size, opts) {
    opts = opts || {};
    var cx = 32, cy = 32, r = 26;
    function pt(deg) {
      var a = deg * Math.PI / 180;
      return [(cx + r * Math.cos(a)).toFixed(2), (cy + r * Math.sin(a)).toFixed(2)];
    }
    var spokes = '';
    for (var i = 0; i < 8; i++) {
      var p = pt(-112.5 + i * 45);
      spokes += 'M32 32L' + p[0] + ' ' + p[1];
    }
    var a1 = pt(-112.5), a2 = pt(-67.5);
    var wedge = 'M32 32L' + a1[0] + ' ' + a1[1] + 'A26 26 0 0 1 ' + a2[0] + ' ' + a2[1] + 'Z';

    // The chute reads as a slot cut through the active wedge. Below 32px it is
    // noise, so it is dropped rather than smeared.
    var chute = size >= 32
      ? '<path d="M32 12.4V24.2" stroke="var(--dl-card)" stroke-width="2.6" stroke-linecap="round"/>'
      : '';
    var sw = size <= 20 ? 3.4 : 2.6;   // thicken strokes so the mark holds at 16px

    return '<svg class="dl-mark' + (opts.stepping ? ' dl-mark--stepping' : '') + '" width="' + size +
           '" height="' + size + '" viewBox="0 0 64 64" aria-hidden="true" focusable="false">' +
           '<circle cx="32" cy="32" r="26" fill="var(--dl-card)"/>' +
           '<path d="' + wedge + '" fill="var(--dl-red)"/>' + chute +
           '<g stroke="var(--dl-ink)" stroke-width="' + sw + '" fill="none" stroke-linecap="round">' +
             '<circle cx="32" cy="32" r="26"/><path d="' + spokes + '"/>' +
           '</g></svg>';
  }

  /* ==================================================================
     DERIVED DATA
     Nothing below stores anything — every figure on screen is computed
     from the dose log so a simulated change cannot leave a stale number
     behind on some other screen.
     ================================================================== */

  /* Stable pseudo-random from a dose id. Used when the clock jumps past an
     open dose: the outcome has to be plausible but must not change if the
     same jump is replayed, or the demo would contradict itself. */
  function hashRand(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 100000) / 100000;
  }

  function windowClosed(dose, at) { return (at || now()) > dose.scheduledTs + WINDOW_RULES.missedAfter * MS_MIN; }

  /* Mirrors the firmware's timeout behaviour. Called on every commit so that
     jumping the clock forward produces the same outcomes the device would. */
  function resolveClock() {
    var t = now(), fired = [];
    DB.doseLog.forEach(function (d) {
      if (d.scheduledTs > t) return;

      if (d.status === 'upcoming' && t <= d.scheduledTs + WINDOW_RULES.dueFor * MS_MIN) {
        d.status = 'due';
        return;
      }
      if (!windowClosed(d, t)) return;

      if (d.status === 'dispensed_not_taken') {
        // The pill sat in the cup until the window closed. That is a miss, and
        // it is the honest outcome to show when the clock is jumped forward.
        d.status = 'missed';
        syncCupState(d.patientId);
        fired.push(d);
      } else if (d.status === 'upcoming' || d.status === 'due') {
        var r = hashRand(d.id), p = r < 0.80 ? 'taken' : (r < 0.87 ? 'late' : 'missed');
        d.status = p;
        d.dispensedTs = d.scheduledTs + MS_MIN;
        if (p === 'taken') d.pickupTs = d.dispensedTs + Math.round(2 + r * 20) * MS_MIN;
        if (p === 'late')  d.pickupTs = d.dispensedTs + Math.round(40 + r * 60) * MS_MIN;
        consumeFromCartridge(d.patientId, d.cartridge, d.qty);
        if (p === 'missed') fired.push(d);
      }
    });

    fired.forEach(function (d) {
      var med = DB.getMedication(d.medId);
      pushAlert(d.patientId, 'urgent', (med ? med.name : 'Dose') + ' missed',
        'The ' + fmtHHMM(d.scheduled) + ' dose window closed with no pickup.',
        'Check on ' + firstName(d.patientId) + ' and consider adjusting the reminder.');
    });
  }

  function firstName(pid) {
    var p = DB.getPatient(pid);
    return p ? p.name.split(' ')[0] : 'the patient';
  }

  function consumeFromCartridge(pid, pos, qty) {
    var c = DB.getCartridge(pid, pos);
    if (c) c.count = Math.max(0, c.count - (qty || 1));
  }

  /* Cup occupancy is derived, never toggled by hand: the load cell reports mass
     in the cup, so clearing one pill while another is still sitting there must
     not report the cup as empty. */
  function syncCupState(pid) {
    var dev = DB.getDevice(pid);
    if (!dev) return;
    dev.cupOccupied = DB.getDoseLog(pid).some(function (d) {
      return d.status === 'dispensed_not_taken';
    });
  }

  function todayDoses(pid) {
    return DB.getDoseLog(pid, ymd(now()))
             .sort(function (a, b) { return a.scheduledTs - b.scheduledTs; });
  }

  /* The hero is a dose *slot*, not a single pill — Margaret takes three things
     at 08:00 and showing them as three separate "next dose" cards would bury
     the one thing the caregiver needs to know. */
  function nextSlot(pid) {
    var open = DB.getDoseLog(pid).filter(function (d) {
      return (d.status === 'upcoming' || d.status === 'due') && d.scheduledTs >= now() - WINDOW_RULES.missedAfter * MS_MIN;
    }).sort(function (a, b) { return a.scheduledTs - b.scheduledTs; });
    if (!open.length) return null;
    var ts = open[0].scheduledTs;
    return { ts: ts, doses: open.filter(function (d) { return d.scheduledTs === ts; }) };
  }

  /* The strip is a to-do list, not a history feed. Anything still in the cup
     always surfaces — it is the one state only our hardware can detect and it
     must never be pushed down the page by yesterday's misses. Misses older
     than a day are still real, but they are no longer actionable today, so
     they collapse into a single line pointing at History. */
  function attentionItems(pid) {
    var t = now();
    var cup = DB.getDoseLog(pid).filter(function (d) { return d.status === 'dispensed_not_taken'; });
    var freshMiss = DB.getDoseLog(pid).filter(function (d) {
      return d.status === 'missed' && (t - d.scheduledTs) < MS_DAY;
    });
    var olderMiss = DB.getDoseLog(pid).filter(function (d) {
      return d.status === 'missed' && (t - d.scheduledTs) >= MS_DAY && (t - d.scheduledTs) < 7 * MS_DAY;
    });
    function newestFirst(a, b) { return b.scheduledTs - a.scheduledTs; }
    return {
      rows: cup.sort(newestFirst).concat(freshMiss.sort(newestFirst)),
      olderMissed: olderMiss.length
    };
  }

  /* Adherence counts only doses whose window has actually closed. Including
     tonight's not-yet-due pills would drag the number down all day and make it
     look like the patient is failing when nothing has happened yet. */
  function adherenceStats(pid, fromTs, toTs) {
    var s = { taken:0, late:0, missed:0, skipped:0, resolved:0, rate:0 };
    DB.getDoseLogRange(pid, fromTs, toTs).forEach(function (d) {
      if (!windowClosed(d)) return;
      if (d.status === 'skipped') { s.skipped++; return; }
      if (d.status === 'taken' || d.status === 'late' || d.status === 'missed') {
        s[d.status]++; s.resolved++;
      }
    });
    s.rate = s.resolved ? (s.taken + s.late) / s.resolved : 0;
    return s;
  }

  function rangeFrom(days) { return startOfDay(now()) - (days - 1) * MS_DAY; }
  function rangeStats(pid, days) { return adherenceStats(pid, rangeFrom(days), now()); }

  function adherenceByDay(pid, days) {
    var out = [], base = startOfDay(now());
    for (var i = days - 1; i >= 0; i--) {
      var from = base - i * MS_DAY, to = from + MS_DAY - 1;
      var s = adherenceStats(pid, from, to);
      out.push({ ts: from, rate: s.rate, resolved: s.resolved, taken: s.taken, late: s.late, missed: s.missed });
    }
    return out;
  }

  /* Doris's whole reason for existing in the dataset: this has to make the
     evening problem impossible to miss. */
  function adherenceByTimeOfDay(pid, days) {
    var buckets = {};
    DB.getDoseLogRange(pid, rangeFrom(days), now()).forEach(function (d) {
      if (!windowClosed(d) || d.status === 'skipped') return;
      var b = buckets[d.scheduled] || (buckets[d.scheduled] = { time:d.scheduled, ok:0, total:0 });
      b.total++;
      if (d.status === 'taken' || d.status === 'late') b.ok++;
    });
    return Object.keys(buckets).sort().map(function (k) {
      var b = buckets[k];
      b.rate = b.total ? b.ok / b.total : 0;
      return b;
    });
  }

  /* Days remaining is pills-on-hand divided by real daily consumption from the
     schedule, not a flat guess — a twice-daily med drains twice as fast. */
  function dailyUse(pid, pos) {
    var c = DB.getCartridge(pid, pos);
    if (!c || !c.medId) return 0;
    var m = DB.getMedication(c.medId);
    return m ? m.times.length * m.qty : 0;
  }
  function daysRemaining(pid, pos) {
    var c = DB.getCartridge(pid, pos), use = dailyUse(pid, pos);
    if (!c || !use) return null;
    return Math.floor(c.count / use);
  }
  function isLow(pid, pos) {
    var d = daysRemaining(pid, pos);
    return d !== null && d < 7;
  }

  function unreadCount() {
    return DB.getAlerts().filter(function (a) { return !a.read; }).length;
  }

  var alertSeq = 100;
  function pushAlert(pid, severity, title, what, action) {
    DB.alerts.unshift({
      id: 'a' + (++alertSeq), patientId: pid, severity: severity,
      atTs: now(), read: false, title: title, what: what, action: action
    });
  }
  /* Seeded alerts carry an offset instead of a timestamp so the feed reads
     correctly whatever day this is demoed, and so it follows the clock. */
  function alertTs(a) { return a.atTs != null ? a.atTs : now() - a.offsetMin * MS_MIN; }

  /* ==================================================================
     SHELL: router, nav, announcements
     ================================================================== */
  var NAV_PRIMARY = [
    { id:'home',       label:'Home',       short:'Home',    icon:'home' },
    { id:'schedule',   label:'Schedule',   short:'Sched',   icon:'schedule' },
    { id:'cartridges', label:'Cartridges', short:'Carts',   icon:'cartridges' },
    { id:'history',    label:'History',    short:'History', icon:'history' },
    { id:'alerts',     label:'Alerts',     short:'Alerts',  icon:'alerts' },
    { id:'settings',   label:'Settings',   short:'Setup',   icon:'settings' }
  ];
  var NAV_SECONDARY = [
    { id:'patient', label:'Patient view', short:'Patient', icon:'patient' }
  ];
  var ALL_VIEWS = NAV_PRIMARY.concat(NAV_SECONDARY).map(function (n) { return n.id; });

  function announce(msg, assertive) {
    var node = $(assertive ? '#live-assertive' : '#live-polite');
    node.textContent = '';
    // Re-setting on the next frame guarantees the announcement fires even when
    // the same message repeats (e.g. two dispenses in a row).
    requestAnimationFrame(function () { node.textContent = msg; });
  }

  var toastTimer = null;
  function toast(msg) {
    var box = $('#toasts');
    box.innerHTML = '<p class="toast">' + esc(msg) + '</p>';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { box.innerHTML = ''; }, 3600);
  }

  /* THE single state-update path. Every mutation goes through here so that a
     change made on one screen is already true on all the others. */
  function commit(mutate, opts) {
    opts = opts || {};
    if (typeof mutate === 'function') mutate();
    resolveClock();
    render();
    if (opts.toast) toast(opts.toast);
    if (opts.announce) announce(opts.announce, opts.assertive);
  }

  /* Hash routing gives deep links and a working back button on file:// and on a
     static host. Some embedded contexts (data: URLs, sandboxed srcdoc frames)
     refuse top-frame fragment writes and log an error for each attempt, so the
     router falls back to pure in-memory navigation there rather than shouting
     into the console. Every view still works either way. */
  var HASH_ROUTING = location.protocol !== 'data:' && location.protocol !== 'about:';

  function go(viewId, opts) {
    if (ALL_VIEWS.indexOf(viewId) === -1) viewId = 'home';
    state.view = viewId;
    if (HASH_ROUTING && location.hash !== '#/' + viewId) location.hash = '#/' + viewId;
    render();
    if (!opts || !opts.silent) {
      $('#main').focus();
      window.scrollTo(0, 0);
    }
  }

  function readHash() {
    if (!HASH_ROUTING) return state.view || 'home';
    var id = (location.hash || '').replace(/^#\/?/, '');
    return ALL_VIEWS.indexOf(id) !== -1 ? id : 'home';
  }

  function renderNav() {
    var unread = unreadCount();

    function link(n, current) {
      var badge = n.id === 'alerts' && unread
        ? '<span class="navlink__count">' + unread + '<span class="sr-only"> unread alerts</span></span>' : '';
      return '<li><button type="button" class="navlink' + (n.id === 'patient' ? ' navlink--alt' : '') +
             '" data-go="' + n.id + '"' + (current ? ' aria-current="page"' : '') + '>' +
             '<span class="navlink__icon">' + icon(n.icon, 20) + '</span>' +
             '<span>' + esc(n.label) + '</span>' + badge + '</button></li>';
    }

    $('#nav-primary').innerHTML   = NAV_PRIMARY.map(function (n) { return link(n, n.id === state.view); }).join('');
    $('#nav-secondary').innerHTML = NAV_SECONDARY.map(function (n) { return link(n, n.id === state.view); }).join('');

    // Mobile: six tabs is the practical limit at 390px, so Settings moves to a
    // gear in the top bar and Patient view keeps its slot in the bar.
    var tabs = NAV_PRIMARY.filter(function (n) { return n.id !== 'settings'; }).concat(NAV_SECONDARY);
    $('#nav-tabs').innerHTML = tabs.map(function (n) {
      var dot = n.id === 'alerts' && unread ? '<span class="tablink__dot" aria-hidden="true"></span>' : '';
      var badge = n.id === 'alerts' && unread ? '<span class="sr-only">, ' + unread + ' unread</span>' : '';
      return '<li><button type="button" class="tablink" data-go="' + n.id + '"' +
             (n.id === state.view ? ' aria-current="page"' : '') + '>' + dot +
             '<span class="tablink__icon">' + icon(n.icon, 22) + '</span>' +
             '<span>' + esc(n.short) + '</span>' + badge + '</button></li>';
    }).join('');
  }

  function renderPatientSeg() {
    var ps = DB.getPatients();
    $('#patient-seg').innerHTML = ps.map(function (p) {
      var on = p.id === state.patientId;
      return '<button type="button" class="seg__btn" data-patient="' + p.id + '" aria-pressed="' + on + '">' +
             esc(p.name.split(' ')[0]) + '</button>';
    }).join('');
  }

  /* ==================================================================
     VIEW 1 — HOME (caregiver dashboard)
     ================================================================== */
  function medLine(dose) {
    var m = DB.getMedication(dose.medId);
    if (!m) return 'Unknown medication';
    return m.name + ' ' + m.strength;
  }

  function deviceLine(pid) {
    var dev = DB.getDevice(pid);
    if (!dev) return '';
    var cup = dev.cupOccupied
      ? '<b>Pill in the cup</b>'
      : 'Cup empty';
    return '<p class="devline">' +
      '<span class="dot ' + (dev.online ? 'dot--on' : 'dot--off') + '" aria-hidden="true"></span>' +
      '<b>' + (dev.online ? 'Online' : 'Offline') + '</b>' +
      '<span class="devline__sep" aria-hidden="true">|</span>' +
      '<span>Synced ' + esc(fmtAgo(now() - dev.lastSyncOffsetMin * MS_MIN)) + '</span>' +
      '<span class="devline__sep" aria-hidden="true">|</span>' + cup +
      '</p>';
  }

  function attentionStrip(pid) {
    var att = attentionItems(pid);
    var items = att.rows;
    if (!items.length && !att.olderMissed) return '';

    var rows = items.map(function (d) {
      var m = DB.getMedication(d.medId);
      var isCup = d.status === 'dispensed_not_taken';
      var when = isCup
        ? 'Dispensed at ' + fmtClock(d.dispensedTs) + ' — ' + fmtAgo(d.dispensedTs)
        : 'Scheduled ' + fmtHHMM(d.scheduled) + ' on ' + fmtDate(d.scheduledTs);
      var actions = isCup
        ? '<button class="btn btn--primary" type="button" data-pickup="' + esc(d.id) + '">Mark picked up</button>' +
          '<button class="btn btn--secondary" type="button" data-skip="' + esc(d.id) + '">Skip this dose</button>'

               chip(d.status) +
               '<div class="attn__body"><strong>' + esc(m ? m.name + ' ' + m.strength : 'Dose') + '</strong>' +
               '<span class="meta">' + esc(when) + '</span></div>' +
               '<div class="row row--tight push">' + actions + '</div>' +
             '</div>';
    }).join('');

    var tail = att.olderMissed
      ? '<div class="attn__item">' +

             '<div class="attn__head">' + icon('warning', 18) +

  function heroSlab(pid) {
    var slot = nextSlot(pid);
    if (!slot) {
      return '<div class="slab"><p class="label">Next dose</p>' +
             '<p class="hero__time" style="font-size:var(--fs-xl)">Nothing left today</p>' +
             '<p class="hero__count">Every scheduled dose has been dispensed. The next one is tomorrow morning.</p></div>';
    }
    var delta = slot.ts - now();
    var isDue = slot.doses.some(function (d) { return d.status === 'due'; });
    var meds = slot.doses.map(function (d) {
      var m = DB.getMedication(d.medId);
      return '<li class="hero__med"><b>' + esc(m ? m.name : 'Dose') + '</b>' +
             '<span>' + esc((m ? m.strength : '') + ' · ' + d.qty + (d.qty === 1 ? ' pill' : ' pills') +
             ' · cartridge ' + d.cartridge) + '</span></li>';
    }).join('');

    return '<div class="slab">' +
             '<p class="label">Next dose</p>' +
             '<p class="hero__time">' + esc(fmtClock(slot.ts)) + '</p>' +
             '<p class="hero__count">' + (isDue ? 'Due now' : 'in ' + esc(fmtDuration(delta))) + '</p>' +
             '<ul class="hero__meds">' + meds + '</ul>' +

  function todayTimeline(pid) {
    var doses = todayDoses(pid);
    if (!doses.length) {
      return '<div class="empty"><h3>No doses scheduled today</h3>' +
             '<p>Add a medication to build a schedule for this patient.</p>' +
             '<button class="btn btn--primary" type="button" data-go="schedule">Go to Schedule</button></div>';
    }

    // Group by scheduled time so a 3-pill morning reads as one moment.
    var slots = [], byTime = {};
    doses.forEach(function (d) {
      if (!byTime[d.scheduled]) { byTime[d.scheduled] = []; slots.push(d.scheduled); }
      byTime[d.scheduled].push(d);
    });

    var t = now();
    return '<ol class="tl">' + slots.map(function (time) {
      var group = byTime[time], ts = group[0].scheduledTs;
      var live = group.some(function (d) { return d.status === 'due' || d.status === 'dispensed_not_taken'; });
      var cls = live ? 'tl__slot--now' : (ts < t ? 'tl__slot--past' : '');

      var rows = group.map(function (d) {
        var m = DB.getMedication(d.medId);
        var stamp = d.pickupTs ? 'Picked up ' + fmtClock(d.pickupTs)
                  : d.dispensedTs ? 'Dispensed ' + fmtClock(d.dispensedTs)
                  : 'Scheduled ' + fmtHHMM(d.scheduled);
        var flag = d.status === 'dispensed_not_taken' ? ' tl__dose--flag' : '';
        return '<li><button type="button" class="tl__dose' + flag + '" data-dose="' + esc(d.id) + '">' +
                 '<span class="tl__name">' + esc(m ? m.name : 'Dose') +
                 '<small>' + esc((m ? m.strength : '') + ' · ' + d.qty + ' pill' + (d.qty === 1 ? '' : 's')) + '</small></span>' +
                 chip(d.status) +
                 '<span class="tl__stamp">' + esc(stamp) + '</span>' +
               '</button></li>';
      }).join('');

      return '<li class="tl__slot ' + cls + '">' +
               '<span class="tl__marker" aria-hidden="true"></span>' +
               '<p class="tl__time">' + esc(fmtHHMM(time)) + '</p>' +
               '<ul class="tl__doses">' + rows + '</ul>' +
             '</li>';
    }).join('') + '</ol>';
  }

  var lastFocus = null;

  function openModal(title, body, foot) {
    lastFocus = document.activeElement;
    $('#modal-title').textContent = title;
    $('#modal-body').innerHTML = body;
    $('#modal-foot').innerHTML = foot || '';
    $('#modal').hidden = false;
    var first = $('#modal-body input, #modal-body select, #modal-body button') || $('#modal-close');
    if (first) first.focus();
  }
  function closeModal() {
    $('#modal').hidden = true;
    $('#modal-body').innerHTML = '';
    $('#modal-foot').innerHTML = '';
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  function modalIsOpen() { return !$('#modal').hidden; }

  /* Focus is trapped rather than merely moved: a caregiver tabbing past the end
     of a dialog on a tablet should not land in the page behind the scrim. */
  function trapFocus(e) {
    if (!modalIsOpen() || e.key !== 'Tab') return;
    var box = $('#modal .modal__box');
    var f = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', box)
              .filter(function (n) { return !n.disabled && n.offsetParent !== null; });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  /* ---- Barcode scan ------------------------------------------------
     Simulated end to end. The app never asks for camera access; on the real
     unit this is the GM65 module, or a phone camera, reading the NDC off the
     label and resolving it against the NLM RxNorm API. */
  var scanTimer = null;

  function startScan() {
    state.prefill = null;   // a previous scan must never leak into this one
    var code = DB.scanSequence[state.scanIndex % DB.scanSequence.length];
    state.scanIndex++;

    openModal('Scan prescription label',
      '<div class="scan">' +
        '<div class="scan__frame"><span></span><span></span><span></span><span></span></div>' +
        '<div class="scan__beam" aria-hidden="true"></div>' +
        '<p class="scan__hint">Hold the barcode inside the frame</p>' +
      '</div>' +
      '<p class="meta" style="margin-top:var(--sp-3)" role="status">Reading barcode…</p>' +
      '<p class="meta">Simulated scan — no camera is used.</p>',
      '<button class="btn btn--secondary" type="button" data-modal-close="1">Cancel</button>');

    clearTimeout(scanTimer);
    scanTimer = setTimeout(function () { showScanResult(code); }, 2000);
  }

  function showScanResult(code) {
    var res = DB.lookupNDC(code);
    var list = res.ndcPropertyList && res.ndcPropertyList.ndcProperty;

    if (!list || !list.length) {
      openModal('Barcode not recognised',
        '<div class="notice notice--warn">' + icon('warning', 20) +
          '<div><b>No match for NDC ' + esc(code) + '</b>' +
          '<p class="meta" style="margin-top:4px">The code scanned cleanly but it is not in the drug directory. ' +
          'This happens with repackaged or compounded prescriptions.</p></div></div>' +
        '<p class="meta" style="margin-top:var(--sp-4)">Type the details from the label instead, or try the scan again ' +
        'with the barcode flat and well lit.</p>',
        '<button class="btn btn--primary" type="button" data-addmed="1">Enter manually</button>' +
        '<button class="btn btn--secondary" type="button" data-scan="1">Scan again</button>' +
        '<button class="btn btn--ghost" type="button" data-modal-close="1">Cancel</button>');
      announce('Barcode not recognised. Enter the medication manually or scan again.', true);
      return;
    }

    var n = list[0], d = n._display;
    var props = {};
    n.propertyConceptList.propertyConcept.forEach(function (pc) { props[pc.propName] = pc.propValue; });

    state.prefill = {
      name: d.name, strength: d.strength, form: d.form,
      qty: 1, ndc: n.ndcItem, rxcui: n.rxcui, packQty: d.packQty
    };

    openModal('Found on the label',
      '<div class="notice notice--good">' + icon('info', 20) +
        '<div><b>' + esc(d.name + ' ' + d.strength) + '</b>' +
        '<p class="meta" style="margin-top:4px">Matched from the NDC on the barcode.</p></div></div>' +
      '<dl class="kv" style="margin-top:var(--sp-4)">' +
        '<dt>NDC</dt><dd class="scan__code">' + esc(n.ndcItem) + '</dd>' +
        '<dt>RxCUI</dt><dd class="scan__code">' + esc(n.rxcui) + '</dd>' +
        '<dt>Dose form</dt><dd>' + esc(props.DOSAGE_FORM || d.form) + '</dd>' +
        '<dt>Packaging</dt><dd>' + esc(n.packagingList.packaging[0]) + '</dd>' +
        '<dt>Labeler</dt><dd>' + esc(props.LABELER || '—') + '</dd>' +
        '<dt>Appearance</dt><dd>' + esc((props.COLORTEXT || '') + ' ' + (props.SHAPE || '').toLowerCase()) + '</dd>' +
      '</dl>' +
      '<p class="meta" style="margin-top:var(--sp-4)">Check this against the label before you continue. ' +
      'You can change any of it on the next screen.</p>',
      '<button class="btn btn--primary" type="button" data-usescan="1">Use these details</button>' +
      '<button class="btn btn--secondary" type="button" data-addmed="1">Correct them</button>' +
      '<button class="btn btn--ghost" type="button" data-scan="1">Scan again</button>');
    announce('Found ' + d.name + ' ' + d.strength + ' on the label.');
  }

  function openMedForm(medId) {
    var pid = state.patientId;
    var m = medId ? DB.getMedication(medId) : null;
